name: Apply Store Loader AI assist 111

on:
  push:
    branches:
      - tmp/store-loader-ai-assist-111
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/store-loader-ai-assist-111
      - name: Apply focused Store Loader changes
        run: |
          echo '' | base64 -d > /tmp/patch111.py
          python /tmp/patch111.py
          node --check server.js
      - name: Commit focused fix
        run: |
          rm .github/workflows/apply-ai-assist-111.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html server.js .github/workflows/apply-ai-assist-111.yml
          git diff --cached --check
          git commit -m "Restore Store Loader AI media workflow"
          git push origin HEAD:tmp/store-loader-ai-assist-111
