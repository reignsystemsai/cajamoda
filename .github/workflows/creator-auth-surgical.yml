name: Creator auth surgical patch
on:
  push:
    branches: [feature/creator-auth-reactivation]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/creator-auth-reactivation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply surgical creator auth changes
        run: node scripts/creator-auth-surgical.mjs
      - name: Verify critical creator flow
        run: |
          npm ci --ignore-scripts
          npm run build
          npm run verify:critical
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/creator-auth-surgical.yml scripts/creator-auth-surgical.mjs
          git add server.js creators/index.html creators/accept/index.html supabase/migrations/202609160001_creator_password_auth.sql
          git commit -m "Implement creator password auth and reactivation"
          git push origin HEAD:feature/creator-auth-reactivation
