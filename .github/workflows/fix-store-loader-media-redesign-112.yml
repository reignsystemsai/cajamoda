name: Apply Store Loader Multimedia redesign

on:
  push:
    branches:
      - fix/store-loader-media-redesign-112
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/store-loader-media-redesign-112
      - name: Apply surgical Multimedia redesign
        run: |
          echo '' | base64 -d > /tmp/fix.py
          python /tmp/fix.py
      - name: Commit fix and remove helper workflow
        run: |
          rm .github/workflows/fix-store-loader-media-redesign-112.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/index.html .github/workflows/fix-store-loader-media-redesign-112.yml
          git diff --cached --check
          git commit -m "Redesign Multimedia with compact thumbnails"
          git push origin HEAD:fix/store-loader-media-redesign-112