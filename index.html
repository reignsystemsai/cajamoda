    closeFavoritesBubble();

    $("utilityBackdrop").classList.add(
      "open"
    );

    setBodyLock();

    track("PLUS_MENU_OPEN");
  }

  function closeUtilityMenu() {
    $("utilityBackdrop").classList.remove(
      "open"
    );

    setBodyLock();
  }

  function setNavActive(name) {
    const map = {
      favorites:
        $("navFavorites"),
      home:
        $("navHome"),
      profile:
        $("navProfile"),
      bag:
        $("navBag")
    };

    Object.values(map).forEach(
      button =>
        button?.classList.remove(
          "active"
        )
    );

    map[name]?.classList.add(
      "active"
    );
  }

  function applyInit(payload = {}) {
    if (
      Array.isArray(payload.products) &&
      payload.products.length
    ) {
      state.products =
        payload.products.map(
          normalizeProduct
        );
    }

    if (payload.identity) {
      state.identity.visitorId =
        payload.identity.visitorId ||
        state.identity.visitorId;

      state.identity.customerId =
        payload.identity.customerId ||
        state.identity.customerId;

      state.identity.memberId =
        payload.identity.memberId ||
        state.identity.memberId;
    }

    if (payload.customerId) {
      state.identity.customerId =
        payload.customerId;
    }

    if (payload.visitorId) {
      state.identity.visitorId =
        payload.visitorId;
    }

    if (payload.memberId) {
      state.identity.memberId =
        payload.memberId;
    }

    if (
      payload.context &&
      typeof payload.context === "object"
    ) {
      state.context = {
        ...state.context,
        ...payload.context
      };
    }

    if (payload.sellerId) {
      state.context.sellerId =
        payload.sellerId;
    }

    if (payload.storefrontId) {
      state.context.storefrontId =
        payload.storefrontId;
    }

    if (payload.storefrontSlug) {
      state.context.storefrontSlug =
        payload.storefrontSlug;
    }

    if (
      payload.brand &&
      typeof payload.brand === "object"
    ) {
      state.brand = {
        ...state.brand,
        ...payload.brand
      };
    }

    if (payload.targetOrigin) {
      state.bridge.targetOrigin =
        payload.targetOrigin;
    }

    if (payload.cart) {
      state.cart =
        normalizeCart(
          payload.cart
        );
    }

    if (payload.supplyContext) {
      applySupplyContext(
        payload.supplyContext
      );
    }

    if (
      Array.isArray(
        payload.storesLocations
      )
    ) {
      applyStoresLocations({
        locations:
          payload.storesLocations,

        defaultLocationId:
          payload.defaultLocationId
      });
    }

    if (
      Array.isArray(
        payload.inventoryItems
      )
    ) {
      upsertInventoryItems(
        payload.inventoryItems
      );
    }

    if (
      payload.inventoryCheckoutMode
    ) {
      const mode =
        payload.inventoryCheckoutMode;

      state.supply.checkoutMode =
        CONFIG.supportedCheckoutModes.includes(
          mode
        )
          ? mode
          : CONFIG.defaultCheckoutMode;
    }

    if (payload.defaultLocationId) {
      state.supply.defaultLocationId =
        payload.defaultLocationId;
    }

    state.reviewFeatureEnabled =
      !!payload.features?.reviewsEnabled;

    state.bridge.ready = true;

    applyBrand();
    renderHomeDelivery();
    renderHome();
    renderFavoritesBubble();
    renderCart();
    syncBagBadges();
    flushBridgeQueue();

    track(
      "STOREFRONT_READY",
      null,
      {
        meta: {
          productCount:
            state.products.length,

          sellerId:
            state.context.sellerId,

          storefrontId:
            state.context.storefrontId,

          reviewsEnabled:
            state.reviewFeatureEnabled
        }
      }
    );
  }

  function applyVariants(payload = {}) {
    const productId =
      payload.productId ||
      payload.id ||
      state.activeProduct?.id;

    const variants =
      payload.variants ||
      payload.items ||
      [];

    if (
      !productId ||
      !Array.isArray(variants)
    ) {
      return;
    }

    const index =
      state.products.findIndex(
        product =>
          String(product.id) ===
          String(productId)
      );

    if (index < 0) return;

    state.products[index].variants =
      variants.map(
        normalizeVariant
      );

    state.products[index].sizes =
      [
        ...new Set(
          state.products[index]
            .variants
            .map(
              variant =>
                variant.size
            )
            .filter(Boolean)
        )
      ];

    if (
      state.activeProduct &&
      String(state.activeProduct.id) ===
      String(productId)
    ) {
      state.activeProduct =
        state.products[index];

      renderSizes();
      renderInventoryHint();

      requestProductSupply(
        state.activeProduct,
        "variants_loaded"
      );
    }
  }

  function applyProductMeta(payload = {}) {
    const productId =
      payload.productId ||
      payload.id;

    if (!productId) return;

    const index =
      state.products.findIndex(
        product =>
          String(product.id) ===
          String(productId)
      );

    if (index < 0) return;

    state.products[index] =
      normalizeProduct({
        ...state.products[index],
        ...payload
      });

    if (
      Array.isArray(
        payload.inventoryItems
      )
    ) {
      upsertInventoryItems(
        payload.inventoryItems,
        {
          replaceForProductId:
            productId
        }
      );

      state.supply
        .productSupplyUpdatedAt
        .set(
          String(productId),
          Date.now()
        );
    }

    if (
      Array.isArray(
        payload.locations
      )
    ) {
      upsertStoresLocations(
        payload.locations
      );
    }

    if (
      state.activeProduct &&
      String(state.activeProduct.id) ===
      String(productId)
    ) {
      state.activeProduct =
        state.products[index];

      renderProduct();
    }
  }

  function applyCatalogPatch(payload = {}) {
    const incoming =
      Array.isArray(payload.products)
        ? payload.products.map(
            normalizeProduct
          )
        : [];

    if (!incoming.length) return;

    const map =
      new Map(
        state.products.map(
          product => [
            String(product.id),
            product
          ]
        )
      );

    incoming.forEach(
      product =>
        map.set(
          String(product.id),
          product
        )
    );

    state.products =
      [...map.values()];

    renderHome();

    if (state.activeProduct) {
      const refreshed =
        findProduct(
          state.activeProduct.id
        );

      if (refreshed) {
        state.activeProduct =
          refreshed;

        renderProduct();
      }
    }
  }

  function handleCartState(payload) {
    const before =
      currentCartCount();

    state.cart =
      normalizeCart(payload);

    const after =
      currentCartCount();

    syncBagBadges(
      before !== after
    );

    renderCart();
    resolvePendingCartMutation();
  }

  function updateIdentity(payload = {}) {
    state.identity.visitorId =
      payload.visitorId ||
      state.identity.visitorId;

    state.identity.customerId =
      payload.customerId ||
      state.identity.customerId;

    state.identity.memberId =
      payload.memberId ||
      state.identity.memberId;

    track(
      "IDENTITY_CONTEXT_UPDATE",
      null,
      {
        meta: {
          hasVisitorId:
            !!state.identity.visitorId,

          hasCustomerId:
            !!state.identity.customerId,

          hasMemberId:
            !!state.identity.memberId
        }
      }
    );
  }

  window.addEventListener(
    "message",
    event => {
      const message =
        event.data ||
        {};

      if (
        message.source &&
        !CONFIG.acceptedParentSources.includes(
          message.source
        )
      ) {
        return;
      }

      const payload =
        message.payload ??
        message.data ??
        {};

      switch (message.type) {
        case "INIT":
          applyInit(payload);
          break;

        case "VARIANTS":
          applyVariants(payload);
          break;

        case "PRODUCT_META":
          applyProductMeta(payload);
          break;

        case "CATALOG_PATCH":
          applyCatalogPatch(payload);
          break;

        case "SUPPLY_CONTEXT":
          applySupplyContext(payload);
          break;

        case "STORES_LOCATIONS":
        case "LOCATIONS_STATE":
          applyStoresLocations(payload);
          break;

        case "PRODUCT_SUPPLY":
          applyProductSupply(payload);
          break;

        case "VARIANT_INVENTORY":
          applyVariantInventory(payload);
          break;

        case "INVENTORY_PATCH":
        case "INVENTORY_STATE_PATCH":
          applyInventoryPatch(payload);
          break;

        case "LOCATION_PATCH":
          applyLocationPatch(payload);
          break;

        case "PURCHASE_PATH_STATE":
          continuePurchaseWithPath(payload);
          break;

        case "SUPPLY_ERROR":
          track(
            "SUPPLY_ERROR",
            state.activeProduct,
            {
              meta: payload
            }
          );

          if (payload.message) {
            showToast(
              payload.message
            );
          }

          break;

        case "CART_STATE":
          handleCartState(payload);
          break;

        case "CART_COUNT":
          state.cart.count =
            Number(
              payload.count ??
              payload ??
              0
            );

          syncBagBadges();
          break;

        case "CUSTOMER_CONTEXT":
        case "IDENTITY_CONTEXT":
          updateIdentity(payload);
          break;

        case "REVIEW_FEATURE_STATE":
          state.reviewFeatureEnabled =
            !!payload.enabled;

          renderFavoritesBubble();
          break;

        case "CART_WORKING":
        case "BUY_WORKING":
          showWorking(
            payload.message ||
            "Procesando…"
          );
          break;

        case "CART_ERROR":
        case "BUY_ERROR":
          clearPurchaseValidationTimer();

          state.pendingPurchaseIntent =
            null;

          hideWorking();

          $("buyButton").classList.remove(
            "working"
          );

          state.pendingCartMutation =
            null;

          showToast(
            payload.message ||
            "No pudimos completar la operación."
          );

          break;

        case "BUY_SUCCESS":
          clearPurchaseValidationTimer();

          state.pendingPurchaseIntent =
            null;

          hideWorking();

          $("buyButton").classList.remove(
            "working"
          );

          break;

        case "RESERVE_SUCCESS":
          hideWorking();

          showToast(
            "Tu interés quedó registrado."
          );

          break;

        case "RESERVE_ERROR":
          hideWorking();

          showToast(
            payload.message ||
            "No pudimos registrar la reserva."
          );

          break;

        case "REVIEW_SUBMITTED":
          showToast(
            "Gracias por tu reseña."
          );

          break;

        default:
          break;
      }
    }
  );

  $("homeDeliveryInfoClose").onclick =
    closeHomeDeliveryInfo;

  $("filterButton").onclick =
    openFilters;

  $("filterClose").onclick =
    closeFilters;

  $("filterOverlay").onclick =
    event => {
      if (
        event.target ===
        $("filterOverlay")
      ) {
        closeFilters();
      }
    };

  $("searchInput").addEventListener(
    "input",
    event => {
      state.searchQuery =
        event.target.value;

      clearTimeout(
        state.searchTimer
      );

      state.searchTimer =
        setTimeout(
          renderHome,
          CONFIG.searchDebounceMs
        );
    }
  );

  $("searchInput").addEventListener(
    "change",
    () => {
      track(
        "SEARCH",
        null,
        {
          meta: {
            query:
              state.searchQuery
          }
        }
      );
    }
  );

  $("searchInput").addEventListener(
    "search",
    () => {
      track(
        "SEARCH",
        null,
        {
          meta: {
            query:
              state.searchQuery
          }
        }
      );

      renderHome();
    }
  );

  $("navPlus").onclick =
    openUtilityMenu;

  $("utilityBackdrop").onclick =
    event => {
      if (
        event.target ===
        $("utilityBackdrop")
      ) {
        closeUtilityMenu();
      }
    };

  qsa("[data-utility-action]").forEach(
    button => {
      button.onclick = () => {
        const action =
          button.dataset.utilityAction;

        track(
          "PLUS_MENU_ACTION",
          null,
          {
            meta: {
              action
            }
          }
        );

        closeUtilityMenu();

        const productContext =
          state.activeProduct
            ? {
                productId:
                  state.activeProduct.id,

                productName:
                  state.activeProduct.name,

                variantId:
                  state.selectedVariantId ||
                  null,

                size:
                  state.selectedSize ||
                  null,

                price:
                  state.activeProduct.price
              }
            : null;

        post(
          action,
          {
            sellerId:
              state.context.sellerId,

            storefrontId:
              state.context.storefrontId,

            storefrontSlug:
              state.context.storefrontSlug,

            guestId:
              state.identity.guestId,

            sessionId:
              state.identity.sessionId,

            productContext,

            channel:
              action === "OPEN_WHATSAPP"
                ? "WHATSAPP"
                : null
          }
        );
      };
    }
  );

  $("navFavorites").onclick =
    openFavoritesBubble;

  $("favoritesClose").onclick =
    closeFavoritesBubble;

  $("favoritesBubble").addEventListener(
    "pointerdown",
    () =>
      clearTimeout(
        state.favoriteTimer
      )
  );

  $("favoriteRail").addEventListener(
    "scroll",
    () =>
      clearTimeout(
        state.favoriteTimer
      ),
    {
      passive: true
    }
  );

  $("navHome").onclick =
    () => {
      closeFavoritesBubble();
      closeUtilityMenu();

      if (state.activeProduct) {
        closeProduct(
          "home_navigation"
        );
      }

      setNavActive("home");

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    };

  $("navProfile").onclick =
    () => {
      setNavActive(
        "profile"
      );

      track(
        "PROFILE_OPEN",
        null,
        {
          meta: {
            destination:
              "customer_login_signup"
          }
        }
      );

      post(
        "OPEN_PROFILE",
        {
          destination:
            "customer_login_signup",

          reason:
            "customer_loyalty_account"
        }
      );
    };

  $("navBag").onclick =
    openCart;

  $("homeBagTop").onclick =
    openCart;

  $("detailsBag").onclick =
    openCart;

  $("cartClose").onclick =
    closeCart;

  $("cartOverlay").onclick =
    event => {
      if (
        event.target ===
        $("cartOverlay")
      ) {
        closeCart();
      }
    };

  $("checkoutButton").onclick =
    checkoutCart;

  $("productBack").onclick =
    () =>
      closeProduct(
        "back_button"
      );

  $("productHeart").onclick =
    () =>
      state.activeProduct &&
      toggleFavorite(
        state.activeProduct.id,
        "product"
      );

  $("productShare").onclick =
    shareActiveProduct;

  $("priceCapsule").onclick =
    openDetailsCapsule;

  $("detailsCollapse").onclick =
    closeDetailsCapsule;

  $("detailsDeliveryInfoClose").onclick =
    closeDetailDeliveryInfo;

  $("buyButton").onclick =
    handleBuyNow;

  $("productScreen").addEventListener(
    "touchstart",
    event => {
      const touch =
        event.touches[0];

      state.touchStartX =
        touch.clientX;

      state.touchStartY =
        touch.clientY;
    },
    {
      passive: true
    }
  );

  $("productScreen").addEventListener(
    "touchend",
    event => {
      if (
        event.target.closest("button") ||
        event.target.closest(
          ".detailsCapsule"
        )
      ) {
        return;
      }

      const touch =
        event.changedTouches[0];

      const dx =
        touch.clientX -
        state.touchStartX;

      const dy =
        touch.clientY -
        state.touchStartY;

      if (
        Math.abs(dx) >
          CONFIG.swipeThreshold &&
        Math.abs(dx) >
          Math.abs(dy) *
          CONFIG.swipeDominance
      ) {
        swipeProduct(
          dx < 0
            ? 1
            : -1
        );
      }
    },
    {
      passive: true
    }
  );

  document.addEventListener(
    "visibilitychange",
    () => {
      if (!state.activeProduct) {
        return;
      }

      if (document.hidden) {
        flushProductDwell(
          "visibility_hidden"
        );
      } else {
        startProductDwell();
      }
    }
  );

  window.addEventListener(
    "beforeunload",
    () =>
      flushProductDwell(
        "page_exit"
      )
  );

  applyBrand();
  renderHomeDelivery();
  renderHome();
  renderFavoritesBubble();
  renderCart();
  syncBagBadges();

  postRaw(
    "READY",
    {
      brand:
        "MODAPOP",

      storefrontVersion:
        "MODAPOP_WORLD_CLASS_V1",

      guestId:
        state.identity.guestId,

      sessionId:
        state.identity.sessionId,

      storefrontSlug:
        state.context.storefrontSlug,

      capabilities: [
        "SPANISH_ONLY_UI",
        "WHITE_BACKGROUND",
        "INTER_FONT",

        "VIBE_FIRST_MERCHANDISING",
        "NOCHES_LARGAS",
        "DIAS_TRANQUILOS",
        "RAPIDO_Y_FACIL",
        "BANO_DE_SOL",

        "TWENTY_PRODUCTS_PER_VIBE",
        "THREE_PRODUCT_CARDS_VISIBLE",

        "IPHONE_PORTRAIT_PRODUCT_STAGE",
        "OBJECT_FIT_COVER_NO_STRETCH",
        "PERSISTENT_RIGHT_THUMBNAILS",
        "PRODUCT_SEQUENCE_SINGLE_NUMBER",

        "HEART_ON_PHOTO",
        "SHARE_ON_PHOTO",

        "COLLAPSED_PRICE_ONLY_CAPSULE",
        "COMPACT_OPEN_DETAILS_CAPSULE",
        "OPEN_CAPSULE_DOWN_ARROW",
        "DETAILS_BAG_BADGE",

        "SIZE_TO_REAL_CART_SYNC",
        "VARIANT_REPLACEMENT_NO_DUPLICATE",
        "CART_QUANTITY_UPDATE",
        "CART_REMOVE",

        "NATIVE_WIX_CHECKOUT_HANDOFF",

        "CLICKABLE_DELIVERY_METHODS",
        "COLLAPSIBLE_DELIVERY_EXPLANATIONS",

        "RESERVE_RELEASE_FLOW",

        "MAX_TWENTY_FAVORITES",
        "SWIPEABLE_FAVORITES_BUBBLE",
        "FAVORITE_REMOVE",

        "WIX_REVIEW_INTEGRATION_HOOK",

        "GUEST_IDENTITY",
        "SESSION_IDENTITY",
        "CUSTOMER_IDENTITY_UPGRADE",

        "PRODUCT_IMPRESSIONS",
        "PRODUCT_CLICKS",
        "PRODUCT_VIEWS",
        "PRODUCT_DWELL",
        "PRODUCT_SWIPES",
        "THUMBNAIL_VIEWS",

        "HEART_ANALYTICS",
        "SHARE_ANALYTICS",
        "SEARCH_ANALYTICS",
        "FILTER_ANALYTICS",
        "SIZE_ANALYTICS",
        "DELIVERY_ANALYTICS",
        "CART_ANALYTICS",
        "CHECKOUT_ANALYTICS",

        "SELLER_ATTRIBUTION",
        "STOREFRONT_ATTRIBUTION",
        "WHITE_LABEL_BRANDING",

        "SUPPLY_CLOUD_PRODUCT_FIELDS",
        "MASTER_PRODUCT_ID",
        "OPAQUE_SUPPLY_REFERENCE",

        "CATALOG_V3_VARIANT_LOCATION_INVENTORY",
        "VARIANT_LOCATION_UNIQUE_PAIR",

        "STORES_LOCATIONS_CONTEXT",
        "DEFAULT_LOCATION_AWARENESS",
        "MULTI_LOCATION_INVENTORY_READINESS",

        "DEFAULT_LOCATION_NATIVE_CHECKOUT_MODE",
        "MULTI_LOCATION_CUSTOM_CHECKOUT_MODE",

        "PURCHASE_PATH_VALIDATION",

        "PRODUCT_SUPPLY_SNAPSHOTS",
        "VARIANT_INVENTORY_SNAPSHOTS",

        "INVENTORY_PATCHING",
        "LOCATION_PATCHING",

        "PREORDER_AWARENESS",
        "LOW_STOCK_AWARENESS",

        "INVENTORY_MODE",
        "INVENTORY_STATUS",
        "FULFILLMENT_CONFIDENCE",
        "SUPPLY_SYNC_TIMESTAMP",

        "CATALOG_PATCHING",

        "SEPARATE_STORE_OWNER_PORTAL",

        "WHATSAPP_PLUS_MENU",
        "WHATSAPP_PRODUCT_CONTEXT",

        "SUPPLIER_SECRETS_SERVER_SIDE_ONLY",
        "SECURE_PARENT_ORIGIN_SUPPORT"
      ]
    }
  );

  /* ================================================================
     REQUIRED WIX BRIDGE / BACKEND CONTRACT
     ----------------------------------------------------------------
     IFRAME -> WIX

       READY
       REQUEST_VARIANTS
       REQUEST_PRODUCT_META

       REQUEST_SUPPLY_CONTEXT
       REQUEST_PRODUCT_SUPPLY
       REQUEST_VARIANT_INVENTORY
       VALIDATE_PURCHASE_PATH

       SYNC_BAG_SELECTION
       UPDATE_BAG_QUANTITY
       REMOVE_BAG_ITEM
       GET_CART

       BUY_NOW
       CHECKOUT_BAG

       OPEN_PROFILE
       OPEN_WHATSAPP
       OPEN_FAQ
       OPEN_HELP
       OPEN_ABOUT
       OPEN_CONTACT
       OPEN_PARTNERS
       OPEN_STORE_OWNER_PORTAL

       RESERVE_RELEASE
       OPEN_REVIEW_COMPOSER
       TRACK_EVENT

     WIX -> IFRAME

       INIT
       VARIANTS
       PRODUCT_META
       CATALOG_PATCH

       SUPPLY_CONTEXT
       STORES_LOCATIONS
       PRODUCT_SUPPLY
       VARIANT_INVENTORY
       INVENTORY_PATCH
       LOCATION_PATCH
       PURCHASE_PATH_STATE

       CART_STATE
       CART_COUNT

       CUSTOMER_CONTEXT
       IDENTITY_CONTEXT

       REVIEW_FEATURE_STATE

       BUY_WORKING
       BUY_SUCCESS
       BUY_ERROR

       CART_WORKING
       CART_ERROR

       RESERVE_SUCCESS
       RESERVE_ERROR

       REVIEW_SUBMITTED
       SUPPLY_ERROR

     BACKEND LAW

       1. Catalog/product creation and Catalog V3 inventory writes happen
          only on secure Wix backend code or a trusted external integration
          service.

       2. Never expose supplier API keys, supplier costs, procurement URLs,
          purchasing credentials, private warehouse contacts, margin logic,
          or private supplier identifiers to this HTML component.

       3. Translate private supplier and sourcing records into opaque
          supplyRef values before they enter the storefront.

       4. Inventory truth is synchronized by the unique:

              variantId + locationId

          pair.

       5. Product-level inventory totals are never allowed to replace the
          variant/location truth required for sourcing and fulfillment.

       6. Wix native checkout may remain the primary fast checkout path when
          inventory strategy uses the Wix default inventory location.

       7. If ModaPop needs a specific non-default supplier warehouse,
          regional distribution center, partner stock location, or other
          inventory location to be decremented, the backend must explicitly
          validate and select the multi-location purchase path.

       8. The storefront can request inventory context, but allocation,
          reservations, supplier routing, warehouse selection, authorization,
          order sourcing, and inventory mutation remain backend operations.

       9. Guest behavior events must retain guestId + sessionId so anonymous
          activity can later be joined to customer/member identity when the
          user logs in, signs up, begins checkout, or otherwise identifies
          themselves.

      10. Every analytics event carries sellerId + storefrontId so ModaPop
          can operate one central commerce engine while supporting future
          seller URLs, white-label storefronts, commission attribution, and
          network-wide demand intelligence.

      11. WhatsApp is a first-class South American customer channel. The
          OPEN_WHATSAPP action carries storefront, guest/session and current
          product context so the Wix layer can create a useful customer
          conversation without exposing protected supply information.

      12. The future Supply Cloud importer can ingest supplier databases,
          APIs, files or warehouse feeds, normalize them with AI, map them to
          ModaPop master products and Wix Catalog V3 variants, then maintain
          the corresponding variant/location inventory records without
          changing this storefront architecture.
     ================================================================ */

  requestSupplyContext();
  postRaw("GET_CART");

})();
</script>
