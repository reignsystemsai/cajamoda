<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>ModaPop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff;
  --ink:#0a0a0a;
  --ink-2:#323232;
  --muted:#777;
  --muted-2:#a0a0a0;
  --line:rgba(0,0,0,.075);
  --line-2:rgba(0,0,0,.12);
  --glass:rgba(255,255,255,.48);
  --glass-strong:rgba(255,255,255,.72);
  --glass-solid:rgba(255,255,255,.9);
  --shadow:0 12px 34px rgba(0,0,0,.065);
  --shadow-strong:0 22px 60px rgba(0,0,0,.11);
  --radius:18px;
  --mobile-max:430px;
  --nav-h:58px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
html{scroll-behavior:smooth}
body{overflow-x:hidden}
body.locked{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;margin:0;cursor:pointer}
button:disabled{cursor:default;opacity:.28}
input,textarea{border:0;outline:0;background:transparent}
img{display:block;max-width:100%;user-select:none;-webkit-user-drag:none}
svg{display:block;pointer-events:none}
.hidden{display:none!important}

.appShell{
  position:relative;
  width:100%;
  min-height:100dvh;
  margin:0 auto;
  padding-bottom:calc(var(--nav-h) + 22px + var(--safe-bottom));
  background:#fff;
}

@media(min-width:700px){
  body{background:#f6f6f6}
  .appShell,.productScreen{width:min(100%,var(--mobile-max));margin:0 auto;box-shadow:0 0 70px rgba(0,0,0,.08)}
}

.glass{
  background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(255,255,255,.35));
  border:1px solid rgba(255,255,255,.94);
  box-shadow:0 0 0 1px rgba(0,0,0,.045),inset 0 1px 0 rgba(255,255,255,.98),var(--shadow);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
}

.glassStrong{
  background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(255,255,255,.58));
  border:1px solid rgba(255,255,255,.98);
  box-shadow:0 0 0 1px rgba(0,0,0,.055),inset 0 1px 0 #fff,var(--shadow-strong);
  backdrop-filter:blur(30px) saturate(175%);
  -webkit-backdrop-filter:blur(30px) saturate(175%);
}

/* =========================
   HOME HEADER
   ========================= */
.homeHeader{
  position:relative;
  height:112px;
  padding-top:var(--safe-top);
}
.homeLogoSlot{
  position:absolute;
  left:50%;
  top:calc(13px + var(--safe-top));
  transform:translateX(-50%);
  width:170px;
  height:68px;
  pointer-events:none;
}
.brandLockup{
  position:absolute;
  left:50%;
  top:calc(13px + var(--safe-top));
  transform:translateX(-50%);
  text-align:center;
  white-space:nowrap;
  pointer-events:none;
}
.brandMonogram{
  position:relative;
  height:48px;
  min-width:92px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Times New Roman",Georgia,serif;
  font-size:51px;
  line-height:.9;
  font-weight:400;
  letter-spacing:-10px;
  padding-right:9px;
}
.brandMonogram .c{position:relative;z-index:2}
.brandMonogram .m{position:relative;z-index:1;margin-left:-7px}
.brandName{
  margin-top:6px;
  padding-left:6px;
  font-family:"Times New Roman",Georgia,serif;
  font-size:10px;
  line-height:1;
  font-weight:600;
  letter-spacing:6px;
}
.homeBagTop{
  position:absolute;
  top:calc(25px + var(--safe-top));
  right:14px;
  width:44px;
  height:44px;
  display:grid;
  place-items:center;
}
.homeBagTop svg{width:25px;height:25px;stroke-width:1.55}
.bagBadge{
  position:absolute;
  top:-2px;
  right:-2px;
  min-width:19px;
  height:19px;
  padding:0 4px;
  border-radius:999px;
  background:#090909;
  color:#fff;
  border:2px solid #fff;
  display:grid;
  place-items:center;
  font-size:9px;
  font-weight:800;
  line-height:1;
}
.bagBadge.bump{animation:badgeBump .22s ease}
@keyframes badgeBump{50%{transform:scale(1.25)}}

.homeContent{padding:0 12px}

/* =========================
   VIBE HERO
   ========================= */
.vibeHero{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  margin-top:2px;
}
.vibeCard{
  position:relative;
  min-width:0;
  aspect-ratio:.70;
  border-radius:10px;
  overflow:hidden;
  background:#eee;
  box-shadow:0 8px 22px rgba(0,0,0,.06);
  scroll-snap-align:start;
}
.vibeCard img{width:100%;height:100%;object-fit:cover}
.vibeCard::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 42%,rgba(0,0,0,.66) 100%)}
.vibeCardLabel{
  position:absolute;
  z-index:2;
  left:5px;
  right:5px;
  bottom:10px;
  color:#fff;
  text-align:center;
  font-size:10px;
  line-height:1.05;
  font-weight:750;
  text-transform:uppercase;
}
.vibeCard.active{outline:1.5px solid rgba(0,0,0,.72);outline-offset:2px}

/* =========================
   DELIVERY METHODS
   ========================= */
.deliverySection{margin-top:9px}
.deliveryRail{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
}
.deliveryCard{
  min-width:0;
  min-height:89px;
  padding:10px 6px 8px;
  border-radius:12px;
  text-align:center;
  transition:transform .15s ease;
}
.deliveryCard:active:not(:disabled){transform:scale(.985)}
.deliveryIcon{width:25px;height:25px;margin:0 auto 7px}
.deliveryIcon svg{width:100%;height:100%;stroke-width:1.5}
.deliveryTitle{font-size:8.6px;line-height:1.22;font-weight:700}
.deliveryEta{margin-top:3px;font-size:7.8px;line-height:1.2;color:var(--muted)}
.deliveryInfo{
  display:none;
  position:relative;
  margin-top:7px;
  min-height:63px;
  padding:11px 42px 11px 12px;
  border-radius:15px;
}
.deliveryInfo.open{display:block;animation:reveal .16s ease}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.deliveryInfoTitle{font-size:10px;font-weight:750}
.deliveryInfoText{margin-top:4px;font-size:8.5px;line-height:1.45;color:#555}
.deliveryInfoClose{
  position:absolute;
  top:50%;
  right:8px;
  transform:translateY(-50%);
  width:30px;
  height:30px;
  border-radius:50%;
  display:grid;
  place-items:center;
}
.deliveryInfoClose svg{width:15px;height:15px;stroke-width:1.5}

/* =========================
   SEARCH / FILTERS
   ========================= */
.searchShell{
  height:48px;
  margin-top:10px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 11px 0 13px;
}
.searchShell>svg{width:19px;height:19px;stroke-width:1.55;flex:0 0 auto}
.searchInput{flex:1;min-width:0;height:44px;font-size:10px}
.searchInput::placeholder{color:#999}
.filterButton{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.filterButton svg{width:18px;height:18px;stroke-width:1.5}
.typeTabs{
  display:flex;
  align-items:center;
  gap:0;
  margin-top:7px;
  overflow-x:auto;
  scrollbar-width:none;
  border-bottom:1px solid rgba(0,0,0,.055);
}
.typeTabs::-webkit-scrollbar{display:none}
.typeTab{
  flex:1 0 auto;
  min-width:68px;
  height:38px;
  padding:0 8px;
  position:relative;
  font-size:8.4px;
  color:#777;
  text-transform:uppercase;
}
.typeTab.active{color:#090909;font-weight:700}
.typeTab.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:#111;border-radius:999px}

/* =========================
   PRODUCT RAILS
   ========================= */
.productSection{margin-top:15px}
.productSectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.productSectionTitle{font-size:13px;font-weight:800;letter-spacing:-.15px;text-transform:uppercase}
.productSectionLink{font-size:8.5px;color:#333}
.productRail{
  display:grid;
  grid-auto-flow:column;
  grid-auto-columns:calc((100vw - 44px)/3);
  gap:8px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  padding-bottom:2px;
}
.productRail::-webkit-scrollbar{display:none}
@media(min-width:700px){.productRail{grid-auto-columns:calc((var(--mobile-max) - 44px)/3)}}
.productCard{min-width:0;scroll-snap-align:start}
.productCardMedia{position:relative;aspect-ratio:.74;border-radius:10px 10px 0 0;overflow:hidden;background:#eee}
.productCardMedia img{width:100%;height:100%;object-fit:cover}
.productHeart{
  position:absolute;
  top:5px;
  right:5px;
  width:27px;
  height:27px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.productHeart svg{width:15px;height:15px;stroke-width:1.7}
.productHeart.active{color:#e3182b}
.productCardInfo{min-height:53px;padding:6px 6px 8px;border:1px solid rgba(0,0,0,.06);border-top:0;border-radius:0 0 10px 10px;background:#fff}
.productCardName{height:19px;overflow:hidden;font-size:8px;line-height:1.22;font-weight:550}
.productCardPrice{margin-top:3px;font-size:9.3px;font-weight:800}
.productDots{height:18px;display:flex;align-items:center;justify-content:center;gap:4px}
.productDot{width:4px;height:4px;border-radius:50%;background:#ddd}
.productDot.active{width:13px;border-radius:999px;background:#111}

/* =========================
   REFINED FIXED BOTTOM NAV
   ========================= */
.bottomNav{
  position:fixed;
  z-index:90;
  left:50%;
  bottom:max(7px,var(--safe-bottom));
  transform:translateX(-50%);
  width:min(calc(100% - 20px),410px);
  height:var(--nav-h);
  border-radius:19px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  align-items:center;
  padding:3px 5px;
  background:linear-gradient(145deg,rgba(255,255,255,.60),rgba(255,255,255,.26));
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 1px rgba(0,0,0,.035),inset 0 1px 0 rgba(255,255,255,.95),0 10px 28px rgba(0,0,0,.08);
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
}
.navButton{
  position:relative;
  height:48px;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.navButton svg{width:20px;height:20px;stroke-width:1.5}
.navButton span{font-size:7.4px;line-height:1}
.navButton.plusOnly svg{width:24px;height:24px}
.navButton.plusOnly span{display:none}
.navButton.active{background:rgba(255,255,255,.74);box-shadow:0 4px 17px rgba(0,0,0,.07)}
.navBagBadge{position:absolute;top:2px;right:calc(50% - 19px);min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:#090909;color:#fff;border:1.5px solid #fff;display:grid;place-items:center;font-size:7px;font-weight:800}

/* =========================
   PLUS MENU - FLOATING LINES
   ========================= */
.utilityBackdrop{position:fixed;inset:0;z-index:105;display:none;background:rgba(255,255,255,.08);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.utilityBackdrop.open{display:block}
.utilityLines{
  position:absolute;
  left:16px;
  bottom:calc(var(--nav-h) + 23px + var(--safe-bottom));
  width:min(280px,calc(100vw - 32px));
}
.utilityLine{
  width:100%;
  min-height:42px;
  padding:0 5px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(0,0,0,.12);
  text-align:left;
  color:#111;
  background:rgba(255,255,255,.38);
  backdrop-filter:blur(18px) saturate(150%);
  -webkit-backdrop-filter:blur(18px) saturate(150%);
}
.utilityLine:first-child{border-top:1px solid rgba(0,0,0,.12)}
.utilityLine span:first-child{font-size:10px;font-weight:600}
.utilityLine span:last-child{font-size:15px;color:#777}
.utilityGroupLabel{margin:12px 0 5px 4px;font-size:7.5px;letter-spacing:1.4px;font-weight:800;color:#777}

/* =========================
   PRODUCT SCREEN
   ========================= */
.productScreen{
  position:fixed;
  z-index:80;
  inset:0;
  background:#fff;
  overflow:hidden;
}
.productPhoto{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center 18%;
  background:#eee;
}
.productShade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.08) 0,transparent 18%,transparent 82%,rgba(255,255,255,.08) 100%);pointer-events:none}
.productTopBar{position:absolute;z-index:4;left:0;right:0;top:0;height:105px;padding-top:var(--safe-top);pointer-events:none}
.productBack{
  pointer-events:auto;
  position:absolute;
  top:calc(16px + var(--safe-top));
  left:12px;
  width:38px;
  height:38px;
  border-radius:50%;
  display:grid;
  place-items:center;
}
.productBack svg{width:20px;height:20px;stroke-width:1.6}
.productBrand{top:calc(11px + var(--safe-top))}
.productBrand .brandMonogram{font-size:43px;height:41px;min-width:80px}
.productBrand .brandName{font-size:8px;letter-spacing:5px;margin-top:4px}

.productSideTools{
  position:absolute;
  z-index:5;
  right:11px;
  top:calc(88px + var(--safe-top));
  width:56px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}
.thumbStack{display:flex;flex-direction:column;gap:6px}
.productThumb{width:52px;height:66px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.35);box-shadow:0 4px 14px rgba(0,0,0,.07)}
.productThumb img{width:100%;height:100%;object-fit:cover}
.productThumb.active{outline:1.5px solid #111;outline-offset:1px}
.productNumber{
  width:43px;
  height:34px;
  border-radius:17px;
  display:grid;
  place-items:center;
  font-size:10px;
  font-weight:700;
}
.sideAction{width:39px;height:39px;border-radius:50%;display:grid;place-items:center}
.sideAction svg{width:20px;height:20px;stroke-width:1.55}
.sideAction.active{color:#e3182b}

/* =========================
   COLLAPSED PRICE CAPSULE
   ========================= */
.priceCapsule{
  position:absolute;
  z-index:6;
  left:12px;
  bottom:calc(var(--nav-h) + 17px + var(--safe-bottom));
  height:45px;
  min-width:154px;
  max-width:190px;
  padding:0 12px 0 15px;
  border-radius:23px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:11px;
}
.priceCapsulePrice{font-size:12px;font-weight:800;white-space:nowrap}
.priceCapsuleCurrency{font-size:7px;font-weight:600;margin-left:2px}
.priceCapsule svg{width:17px;height:17px;stroke-width:1.7;flex:0 0 auto}

/* =========================
   OPEN DETAILS CAPSULE
   ========================= */
.detailsCapsule{
  position:absolute;
  z-index:7;
  right:10px;
  bottom:calc(var(--nav-h) + 17px + var(--safe-bottom));
  width:min(82vw,340px);
  max-height:46dvh;
  overflow:auto;
  border-radius:22px;
  padding:12px;
  display:none;
  scrollbar-width:none;
}
.detailsCapsule::-webkit-scrollbar{display:none}
.detailsCapsule.open{display:block;animation:detailsOpen .17s ease}
@keyframes detailsOpen{from{opacity:0;transform:translateY(7px) scale(.98)}to{opacity:1;transform:none}}
.detailsHeader{display:grid;grid-template-columns:44px 1fr auto;gap:9px;align-items:center}
.detailsHeader img{width:44px;height:54px;border-radius:9px;object-fit:cover}
.detailsName{font-size:11px;font-weight:700;line-height:1.2}
.detailsPrice{margin-top:3px;font-size:11px;font-weight:800}
.detailsCollapse{width:31px;height:31px;border-radius:50%;display:grid;place-items:center}
.detailsCollapse svg{width:16px;height:16px;stroke-width:1.7}
.detailsBag{
  position:relative;
  width:37px;
  height:37px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin-left:auto;
}
.detailsBag svg{width:20px;height:20px;stroke-width:1.5}
.detailsBag .bagBadge{top:-4px;right:-4px}
.detailsDivider{height:1px;background:rgba(0,0,0,.07);margin:9px 0}
.detailsLabel{font-size:7.4px;font-weight:800;letter-spacing:1.05px;color:#666;text-transform:uppercase}
.sizeRail{display:flex;gap:6px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
.sizeRail::-webkit-scrollbar{display:none}
.sizeButton{flex:0 0 auto;min-width:36px;height:32px;padding:0 8px;border:1px solid rgba(0,0,0,.11);border-radius:16px;background:rgba(255,255,255,.55);font-size:8.5px}
.sizeButton.active{background:#0a0a0a;color:#fff;border-color:#0a0a0a}
.inventoryHint{display:none;margin-top:6px;min-height:18px;align-items:center;gap:6px;font-size:7.5px;line-height:1.35;color:#555}
.inventoryHint.show{display:flex}
.inventoryHintDot{width:6px;height:6px;border-radius:50%;background:#111;flex:0 0 auto}
.inventoryHint.low .inventoryHintDot{background:#777}
.inventoryHint.preorder .inventoryHintDot{background:#111;outline:1px solid rgba(0,0,0,.18);outline-offset:2px}
.inventoryHint.out .inventoryHintDot{background:#bbb}
.detailsDelivery{display:flex;gap:5px;margin-top:7px;overflow-x:auto;scrollbar-width:none}
.detailsDelivery::-webkit-scrollbar{display:none}
.detailsDeliveryButton{flex:0 0 auto;height:30px;padding:0 9px;border-radius:15px;border:1px solid rgba(0,0,0,.09);background:rgba(255,255,255,.48);font-size:7.8px;white-space:nowrap}
.detailsDeliveryButton.active{background:#111;color:#fff;border-color:#111}
.detailsDeliveryInfo{display:none;position:relative;margin-top:6px;padding:8px 31px 8px 9px;border-radius:12px;font-size:7.8px;line-height:1.4;color:#444}
.detailsDeliveryInfo.open{display:block}
.detailsDeliveryInfoClose{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:23px;height:23px;border-radius:50%;display:grid;place-items:center}
.detailsDeliveryInfoClose svg{width:12px;height:12px;stroke-width:1.5}
.detailsDescription{margin-top:7px;font-size:8px;line-height:1.48;color:#444;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.buyButton{width:100%;height:43px;margin-top:10px;border-radius:13px;background:#090909;color:#fff;font-size:10px;font-weight:750;letter-spacing:.15px}
.buyButton.working{opacity:.55;pointer-events:none}

/* =========================
   CART DRAWER
   ========================= */
.overlay{position:fixed;inset:0;z-index:130;display:none;background:rgba(0,0,0,.13);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.overlay.open{display:block}
.cartDrawer{
  position:absolute;
  left:8px;
  right:8px;
  bottom:8px;
  max-height:78dvh;
  overflow:auto;
  border-radius:24px;
  padding:15px 14px calc(16px + var(--safe-bottom));
}
.cartHead{display:flex;align-items:center;justify-content:space-between}
.cartTitle{font-size:16px;font-weight:800}
.closeCircle{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.closeCircle svg{width:16px;height:16px;stroke-width:1.5}
.cartItem{display:grid;grid-template-columns:61px 1fr auto;gap:9px;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.07)}
.cartItem img{width:61px;height:78px;border-radius:10px;object-fit:cover;background:#eee}
.cartItemName{font-size:9px;font-weight:700;line-height:1.3}
.cartItemMeta{margin-top:4px;font-size:7.8px;color:#777}
.qtyRow{display:flex;align-items:center;gap:6px;margin-top:8px}
.qtyButton{width:25px;height:25px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:grid;place-items:center;font-size:11px}
.qtyValue{font-size:8px;min-width:14px;text-align:center}
.removeLine{margin-top:7px;font-size:7.6px;text-decoration:underline;text-underline-offset:2px;color:#555}
.cartItemPrice{font-size:8.5px;font-weight:750;white-space:nowrap}
.cartEmpty{padding:30px 5px;text-align:center;font-size:9.5px;color:#777}
.cartSummary{margin-top:11px}
.summaryRow{display:flex;align-items:center;justify-content:space-between;min-height:31px;font-size:9px}
.summaryRow.total{margin-top:4px;padding-top:9px;border-top:1px solid rgba(0,0,0,.08);font-size:11px;font-weight:800}
.checkoutButton{width:100%;height:45px;margin-top:10px;border-radius:13px;background:#090909;color:#fff;font-size:10px;font-weight:800}

/* =========================
   FAVORITES BUBBLE
   ========================= */
.favoritesBubble{
  position:fixed;
  z-index:115;
  left:8px;
  right:8px;
  bottom:calc(var(--nav-h) + 15px + var(--safe-bottom));
  display:none;
  border-radius:23px;
  padding:12px;
}
.favoritesBubble.open{display:block;animation:detailsOpen .17s ease}
.favoritesHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.favoritesHeadLeft{display:flex;align-items:center;gap:7px}
.favoritesHeadLeft svg{width:18px;height:18px;stroke-width:1.55}
.favoritesTitle{font-size:12px;font-weight:800}
.favoritesCount{font-size:8px;color:#777}
.favoriteRail{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.favoriteRail::-webkit-scrollbar{display:none}
.favoriteCard{position:relative;flex:0 0 93px;scroll-snap-align:start}
.favoriteCardMedia{width:93px;height:116px;border-radius:11px;overflow:hidden;background:#eee}
.favoriteCardMedia img{width:100%;height:100%;object-fit:cover}
.favoriteRemove{position:absolute;right:4px;top:4px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9)}
.favoriteRemove svg{width:12px;height:12px;stroke-width:1.6}
.favoriteCardName{margin-top:5px;height:18px;overflow:hidden;font-size:7.5px;line-height:1.2}
.favoriteCardPrice{margin-top:2px;font-size:8.5px;font-weight:800}
.favoriteReviewHook{display:none;margin-top:4px;font-size:7px;color:#555;text-decoration:underline}
.reviewEnabled .favoriteReviewHook{display:inline-block}
.favoritesDots{height:14px;display:flex;align-items:end;justify-content:center;gap:4px}
.favoritesDots span{width:4px;height:4px;border-radius:50%;background:#d6d6d6}
.favoritesDots span.active{background:#111}

/* =========================
   FILTER SHEET
   ========================= */
.filterSheet{position:absolute;left:8px;right:8px;bottom:8px;border-radius:23px;padding:14px 13px calc(16px + var(--safe-bottom))}
.filterHead{display:flex;align-items:center;justify-content:space-between}
.filterTitle{font-size:14px;font-weight:800}
.filterGroup{margin-top:13px}
.filterGroupTitle{font-size:7.5px;font-weight:800;letter-spacing:1px;color:#777}
.filterChoices{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.filterChoice{height:32px;padding:0 11px;border-radius:16px;border:1px solid rgba(0,0,0,.1);font-size:8px}
.filterChoice.active{background:#111;color:#fff;border-color:#111}

/* =========================
   STATUS / TOAST
   ========================= */
.toast{position:fixed;z-index:220;left:50%;bottom:calc(var(--nav-h) + 25px + var(--safe-bottom));transform:translateX(-50%) translateY(8px);max-width:calc(100vw - 36px);padding:9px 13px;border-radius:999px;background:#090909;color:#fff;font-size:8.5px;opacity:0;pointer-events:none;transition:.18s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.workingVeil{position:fixed;inset:0;z-index:210;display:none;place-items:center;background:rgba(255,255,255,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.workingVeil.open{display:grid}
.workingPill{padding:10px 14px;border-radius:999px;font-size:9px;font-weight:700}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
(() => {
  "use strict";

  const CONFIG = Object.freeze({
    bridgeSource: "MODAPOP_IFRAME",
    acceptedParentSources: ["MODAPOP_WIX", "MODAPOP_WIX"],
    maxFavorites: 20,
    maxProductsPerVibe: 20,
    favoriteAutoCloseMs: 5000,
    searchDebounceMs: 180,
    swipeThreshold: 54,
    swipeDominance: 1.18,
    impressionThreshold: 0.55,
    defaultProductType: "Vestidos",
    cartCatalogAppId: "215238eb-22a5-4c36-9e7b-e7c08025e04e",
    inventoryFreshnessMs: 60 * 1000,
    supplyValidationTimeoutMs: 1400,
    lowStockThreshold: 4,
    defaultCheckoutMode: "DEFAULT_LOCATION_NATIVE",
    supportedCheckoutModes: ["DEFAULT_LOCATION_NATIVE", "MULTI_LOCATION_CUSTOM"],
    exposeSupplierSecretsToClient: false
  });

  const VIBES = Object.freeze([
    {id:"late",name:"Noches Largas",image:"https://images.unsplash.com/photo-1566174053879-31528523f8ae?auto=format&fit=crop&w=800&q=88"},
    {id:"chill",name:"Días Tranquilos",image:"https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=800&q=88"},
    {id:"quick",name:"Rápido y Fácil",image:"https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=800&q=88"},
    {id:"sun",name:"Baño de Sol",image:"https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?auto=format&fit=crop&w=800&q=88"}
  ]);

  const PRODUCT_TYPES = Object.freeze(["Todos","Vestidos","Tops","Conjuntos","Enterizos"]);

  const DELIVERY_METHODS = Object.freeze([
    {id:"pickup",title:"Recoge en tienda",eta:"Local",description:"Compra en línea y recoge localmente cuando confirmemos que tu pedido está listo.",icon:"pin"},
    {id:"fast",title:"Entrega rápida",eta:"24–48 h",description:"Productos elegibles se procesan con prioridad para una entrega estimada de 24 a 48 horas.",icon:"truck"},
    {id:"ship",title:"Envíos",eta:"14–21 días",description:"Productos conectados a nuestra red de suministro pueden requerir 14 a 21 días, sujetos a disponibilidad.",icon:"globe"},
    {id:"reserve",title:"Reserva el lanzamiento",eta:"Sé la primera",description:"Registra tu interés antes del lanzamiento. La reserva no procesa un pago inmediato.",icon:"spark"}
  ]);

  const DEMO_PHOTOS = Object.freeze([
    "photo-1566174053879-31528523f8ae","photo-1595777457583-95e059d581b8","photo-1515886657613-9f3515b0c78f",
    "photo-1539109136881-3be0616acf4b","photo-1509631179647-0177331693ae","photo-1490481651871-ab68de25d43d",
    "photo-1529139574466-a303027c1d8b","photo-1525507119028-ed4c629a60a3","photo-1551488831-00ddcb6c6bd3",
    "photo-1485230895905-ec40ba36b9bc","photo-1515372039744-b8f02a3ae446","photo-1523381210434-271e8be1f52b",
    "photo-1534528741775-53994a69daeb","photo-1517841905240-472988babdf9","photo-1558769132-cb1aea458c5e",
    "photo-1506629082955-511b1aa562c8","photo-1521572163474-6864f9cf17ab","photo-1496747611176-843222e1e57c",
    "photo-1485968579580-b6d095142e6e","photo-1542291026-7eec264c27ff"
  ]);

  const DEMO_NAMES = Object.freeze([
    "Vestido Eclipse","Vestido Midnight","Conjunto Soft","Top Aura","Enterizo City",
    "Vestido Arena","Conjunto Noir","Vestido Luna","Top Downtown","Enterizo Clean",
    "Vestido Sunset","Conjunto Weekend","Vestido Brisa","Top Essential","Enterizo Golden",
    "Vestido After","Set Minimal","Vestido Easy","Top Calm","Enterizo Light"
  ]);

  const $ = id => document.getElementById(id);
  const qs = (selector,root=document) => root.querySelector(selector);
  const qsa = (selector,root=document) => [...root.querySelectorAll(selector)];

  function createId(){
    if(window.crypto?.randomUUID)return window.crypto.randomUUID();
    return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
  }

  function getOrCreateLocalId(key){
    try{
      const current=localStorage.getItem(key);
      if(current)return current;
      const next=createId();
      localStorage.setItem(key,next);
      return next;
    }catch{
      return createId();
    }
  }

  function getOrCreateSessionId(){
    try{
      const current=sessionStorage.getItem("modapop-session-id");
      if(current)return current;
      const next=createId();
      sessionStorage.setItem("modapop-session-id",next);
      return next;
    }catch{
      return createId();
    }
  }

  function readFavorites(){
    try{
      const parsed=JSON.parse(localStorage.getItem("modapop-favorites")||"[]");
      return Array.isArray(parsed)?parsed.map(String).slice(0,CONFIG.maxFavorites):[];
    }catch{
      return [];
    }
  }

  function saveFavorites(){
    try{
      localStorage.setItem("modapop-favorites",JSON.stringify([...state.favorites]));
    }catch{}
  }

  function parentOriginFromReferrer(){
    try{
      if(!document.referrer)return "*";
      return new URL(document.referrer).origin;
    }catch{
      return "*";
    }
  }

  const params=new URLSearchParams(location.search);

  const state={
    products:createDemoCatalog(),
    activeVibe:"late",
    selectedType:"Todos",
    searchQuery:"",
    activeProduct:null,
    activeProductIndex:0,
    activeMediaIndex:0,
    selectedSize:"",
    selectedVariantId:null,
    selectedDeliveryMethod:"",
    homeDeliveryOpen:null,
    detailDeliveryOpen:null,
    favorites:new Set(readFavorites()),
    favoriteTimer:null,
    reviewFeatureEnabled:false,
    cart:{items:[],count:0,total:0},
    pendingCartMutation:null,
    pendingPurchaseIntent:null,
    purchaseValidationTimer:null,
    productOpenedAt:null,
    impressionsSeen:new Set(),
    impressionObserver:null,
    searchTimer:null,
    touchStartX:0,
    touchStartY:0,
    bridge:{ready:false,targetOrigin:parentOriginFromReferrer(),queuedMessages:[]},
    identity:{
      guestId:getOrCreateLocalId("modapop-guest-id"),
      sessionId:getOrCreateSessionId(),
      visitorId:null,
      customerId:null,
      memberId:null
    },
    context:{
      sellerId:"MODAPOP",
      storefrontId:"MODAPOP",
      storefrontSlug:params.get("store")||params.get("storefront")||"",
      campaign:params.get("utm_campaign")||"",
      source:params.get("utm_source")||document.referrer||"direct",
      medium:params.get("utm_medium")||"",
      content:params.get("utm_content")||""
    },
    brand:{
      name:"MODAPOP",
      monogram:"CM",
            publicName:"ModaPop"
    },
    supply:{
      enabled:true,
      checkoutMode:CONFIG.defaultCheckoutMode,
      defaultLocationId:null,
      locations:new Map(),
      inventoryItems:new Map(),
      inventoryByVariant:new Map(),
      productSupplyUpdatedAt:new Map(),
      supportsLocationInventory:false,
      supportsReservations:false,
      supportsPreorder:false,
      supportsCustomMultiLocationCheckout:false,
      opaqueSupplyRefs:new Map(),
      lastGlobalSyncAt:null
    }
  };

  function unsplash(id,width=1000,quality=86){
    return `https://images.unsplash.com/${id}?auto=format&fit=crop&w=${width}&q=${quality}`;
  }

  function createDemoCatalog(){
    const out=[];
    VIBES.forEach((vibe,vibeIndex)=>{
      for(let i=0;i<CONFIG.maxProductsPerVibe;i+=1){
        const photo=DEMO_PHOTOS[(i+vibeIndex*4)%DEMO_PHOTOS.length];

          masterProductId:null,
          source:"demo",
          name:DEMO_NAMES[i%DEMO_NAMES.length],
          productType:types[i%types.length],
          vibeId:vibe.id,
          vibes:[vibe.id],
          price:69900+(i%7)*10000,
          media:[unsplash(photo,1200,88),unsplash(photo,1000,84),unsplash(photo,850,80)],
          sizes:["XS","S","M","L","XL"],
          variants:[],
          deliveryModes:i%4===0?["pickup","fast","ship"]:i%3===0?["fast","ship"]:["ship"],
          inventoryMode:i%4===0?"STOCKED":i%2===0?"PARTNER":"ON_DEMAND",
          inventoryStatus:"AVAILABLE",
          inventoryQuantity:null,
          fulfillmentConfidence:i%4===0?98:i%2===0?92:82,
          supplyRef:null,
          defaultLocationId:null,
          inventoryItems:[],
          supplySyncAt:null,
          description:"Una pieza seleccionada para construir el look completo de manera rápida, visual y sencilla.",
          reviews:[]
        });
      }
    });
    return out;
  }

  function escapeHtml(value){
    return String(value??"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  function normalizeVibe(value){
    const v=String(value||"").trim().toLowerCase();
    if(["late","noches largas","night","night out"].includes(v))return "late";
    if(v.includes("tranquil")||v.includes("chill"))return "chill";
    if(v.includes("rápido")||v.includes("rapido")||v.includes("quick"))return "quick";
    if(v.includes("sol")||v.includes("sun"))return "sun";
    return "late";
  }

  function normalizeVariant(variant){
    const options=variant.options||variant.choices||{};
    return{
      ...variant,
      id:variant.id||variant._id||variant.variantId||"",
      productId:variant.productId||variant.product_id||null,
      size:variant.size||variant.name||options.Size||options.size||"",
      color:variant.color||options.Color||options.color||"",
      sku:variant.sku||variant.stockKeepingUnit||"",
      price:Number(variant.price?.amount??variant.price??0),
      inStock:variant.inStock!==false&&variant.available!==false&&variant.inventoryStatus!=="OUT_OF_STOCK",
      supplyRef:variant.supplyRef||variant.supply_ref||null
    };
  }

  function normalizeStoresLocation(location){
    const defaultLocation=location.defaultLocation??location.default??location.isDefault??false;
    return{
      id:location.id||location._id||location.locationId||location.storesLocationId||"",
      wixLocationId:location.wixLocationId||location.wix_location_id||null,
      name:location.name||location.displayName||"Ubicación",
      defaultLocation:!!defaultLocation,
      active:location.active!==false&&location.status!=="INACTIVE",
      country:location.country||location.address?.country||null,
      city:location.city||location.address?.city||null,
      locationType:location.locationType||location.type||"INVENTORY",
      fulfillmentPriority:Number(location.fulfillmentPriority??location.priority??100),
      publicLabel:location.publicLabel||null
    };
  }

  function normalizeInventoryItem(item){
    const quantityRaw=item.quantity??item.stock?.quantity??item.inventory?.quantity??null;
    const quantity=quantityRaw==null?null:Number(quantityRaw);
    const trackingMethod=String(item.trackingMethod||item.tracking_method||(quantityRaw!=null?"QUANTITY":"IN_STOCK"));
    const availabilityStatus=String(item.availabilityStatus||item.availability_status||item.status||"UNKNOWN");
    const preorder=item.preorder||item.preorderSettings||item.preorder_settings||null;
    const locationId=item.locationId||item.location_id||item.storesLocationId||null;
    const variantId=item.variantId||item.variant_id||null;
    return{
      id:item.id||item._id||item.inventoryItemId||`${variantId||"variant"}:${locationId||"location"}`,
      productId:item.productId||item.product_id||null,
      variantId,
      locationId,
      quantity:Number.isFinite(quantity)?quantity:null,
      trackingMethod,
      availabilityStatus,
      inStock:item.inStock??item.in_stock??null,
      preorder:preorder?{
        enabled:preorder.enabled??preorder.preorderEnabled??true,
        limit:preorder.limit??preorder.preorderLimit??null,
        message:preorder.message||null
      }:null,
      updatedAt:item.updatedAt||item.updatedDate||item.updated_date||null,
      supplyRef:item.supplyRef||item.supply_ref||null
    };
  }

  function normalizeProduct(product){
    const media=Array.isArray(product.media)
      ?product.media.map(item=>typeof item==="string"?item:item.url||item.src||item.image?.url||item.imageUrl||"").filter(Boolean)
      :[product.image||product.imageUrl||""].filter(Boolean);
    const variants=Array.isArray(product.variants)?product.variants.map(normalizeVariant):[];
    const sizes=[...new Set([...(Array.isArray(product.sizes)?product.sizes:[]),...variants.map(v=>v.size).filter(Boolean)])];
    const vibeId=normalizeVibe(product.vibeId||product.vibe||product.vibes?.[0]);
    const inventoryItems=Array.isArray(product.inventoryItems)?product.inventoryItems.map(normalizeInventoryItem):[];

    return{
      id:product.id||product._id||createId(),
      masterProductId:product.masterProductId||product.master_product_id||null,
      source:product.source||"wix",
      name:product.name||"Producto",
      productType:product.productType||product.type||product.category||CONFIG.defaultProductType,
      vibeId,
      vibes:[vibeId],
      price:Number(product.price?.amount??product.price??0),
      media,
      sizes,
      variants,
      deliveryModes:Array.isArray(product.deliveryModes)&&product.deliveryModes.length?product.deliveryModes:["ship"],
      inventoryMode:product.inventoryMode||product.inventory_mode||null,
      inventoryStatus:product.inventoryStatus||product.inventory_status||null,
      inventoryQuantity:product.inventoryQuantity??product.quantity??null,
      fulfillmentConfidence:product.fulfillmentConfidence??product.fulfillment_confidence??null,
      supplyRef:product.supplyRef||product.supply_ref||null,
      defaultLocationId:product.defaultLocationId||product.default_location_id||null,
      inventoryItems,
      supplySyncAt:product.supplySyncAt||product.supply_sync_at||null,
      description:product.description||product.detail||"",
      reviews:Array.isArray(product.reviews)?product.reviews:[]
    };
  }

  /* ================================================================
     SUPPLY CLOUD / WIX CATALOG V3 CLIENT BOUNDARY
     ----------------------------------------------------------------
     Wix Catalog V3 inventory truth is represented as:
     PRODUCT -> VARIANT -> INVENTORY ITEM -> LOCATION.

     Every inventory record is keyed by the unique variantId/locationId
     combination. The browser receives only sellability, quantity,
     location identifiers, and opaque supply references.

     Supplier credentials, supplier costs, source URLs, procurement APIs,
     margin calculations, sourcing contacts and warehouse secrets must
     remain on the Wix backend / Supply Cloud and must never be posted into
     this HTML element.
     ================================================================ */

  function inventoryPairKey(variantId,locationId){
    return `${String(variantId||"")}|${String(locationId||"")}`;
  }

  function inventoryItemKey(item){
    return item.id||inventoryPairKey(item.variantId,item.locationId);
  }

  function upsertStoresLocations(locations=[]){
    locations.map(normalizeStoresLocation).forEach(location=>{
      if(!location.id)return;
      state.supply.locations.set(String(location.id),location);
      if(location.defaultLocation)state.supply.defaultLocationId=String(location.id);
    });
  }

  function rebuildInventoryByVariant(){
    state.supply.inventoryByVariant.clear();
    state.supply.inventoryItems.forEach(item=>{
      if(!item.variantId)return;
      const key=String(item.variantId);
      const bucket=state.supply.inventoryByVariant.get(key)||[];
      bucket.push(item);
      state.supply.inventoryByVariant.set(key,bucket);
    });
  }

  function upsertInventoryItems(items=[],{replaceForProductId=null}={}){
    if(replaceForProductId){
      [...state.supply.inventoryItems.entries()].forEach(([key,item])=>{
        if(String(item.productId||"")===String(replaceForProductId)){
          state.supply.inventoryItems.delete(key);
        }
      });
    }

    items.map(normalizeInventoryItem).forEach(item=>{
      if(!item.variantId||!item.locationId)return;
      const key=inventoryPairKey(item.variantId,item.locationId);
      state.supply.inventoryItems.set(key,item);
    });

    rebuildInventoryByVariant();
  }

  function inventoryItemsForVariant(variantId){
    return state.supply.inventoryByVariant.get(String(variantId||""))||[];
  }

  function locationForId(locationId){
    return state.supply.locations.get(String(locationId||""))||null;
  }

  function inventoryItemSellable(item){
    if(!item)return false;
    const status=String(item.availabilityStatus||"").toUpperCase();
    const preorderEnabled=!!item.preorder?.enabled;

    if(status.includes("OUT_OF_STOCK")&&!preorderEnabled)return false;
    if(status.includes("UNAVAILABLE")&&!preorderEnabled)return false;

    if(item.trackingMethod.toUpperCase().includes("QUANTITY")&&item.quantity!=null){
      return item.quantity>0||preorderEnabled;
    }

    if(item.inStock===false&&!preorderEnabled)return false;
    return status!=="OUT_OF_STOCK"||preorderEnabled;
  }

  function inventoryItemPreorderOnly(item){
    if(!item?.preorder?.enabled)return false;
    if(item.quantity!=null)return item.quantity<=0;
    return item.inStock===false||String(item.availabilityStatus||"").toUpperCase().includes("PREORDER");
  }

  function variantInventorySummary(variantId){
    const items=inventoryItemsForVariant(variantId).filter(item=>{
      const location=locationForId(item.locationId);
      return !location||location.active;
    });

    if(!items.length){
      return{
        hasLocationData:false,
        sellable:null,
        quantity:null,
        preorderOnly:false,
        lowStock:false,
        candidateLocationIds:[],
        preferredLocationId:null,
        defaultLocationItem:null,
        defaultLocationQuantity:null
      };
    }

    const sellableItems=items.filter(inventoryItemSellable);
    const quantityValues=sellableItems.map(item=>item.quantity).filter(Number.isFinite);
    const quantity=quantityValues.length?quantityValues.reduce((sum,value)=>sum+value,0):null;
    const preorderOnly=sellableItems.length>0&&sellableItems.every(inventoryItemPreorderOnly);
    const lowStock=quantity!=null&&quantity>0&&quantity<=CONFIG.lowStockThreshold;
    const defaultLocationItem=items.find(item=>String(item.locationId)===String(state.supply.defaultLocationId||""))||null;

    const ranked=[...sellableItems].sort((a,b)=>{
      const aLoc=locationForId(a.locationId);
      const bLoc=locationForId(b.locationId);
      const aDefault=String(a.locationId)===String(state.supply.defaultLocationId||"")?0:1;
      const bDefault=String(b.locationId)===String(state.supply.defaultLocationId||"")?0:1;

      if(aDefault!==bDefault)return aDefault-bDefault;

      const priorityDiff=
        Number(aLoc?.fulfillmentPriority??100)-
        Number(bLoc?.fulfillmentPriority??100);

      if(priorityDiff!==0)return priorityDiff;
      return Number(b.quantity??0)-Number(a.quantity??0);
    });

    return{
      hasLocationData:true,
      sellable:sellableItems.length>0,
      quantity,
      preorderOnly,
      lowStock,
      candidateLocationIds:ranked.map(item=>String(item.locationId)),
      preferredLocationId:ranked[0]?.locationId||null,
      defaultLocationItem,
      defaultLocationQuantity:defaultLocationItem?.quantity??null
    };
  }

  function isSupplySnapshotFresh(productId){
    const updated=state.supply.productSupplyUpdatedAt.get(String(productId||""));
    if(!updated)return false;
    return Date.now()-updated<CONFIG.inventoryFreshnessMs;
  }

    postRaw("REQUEST_SUPPLY_CONTEXT",{
      storefrontId:state.context.storefrontId,
      storefrontSlug:state.context.storefrontSlug,
      requestedModel:"CATALOG_V3_VARIANT_LOCATION"
    });

  function requestProductSupply(product,reason="product_view"){
    if(!product||product.source==="demo")return;
    post("REQUEST_PRODUCT_SUPPLY",{
      productId:product.id,

  function requestVariantInventory(product,variantId,reason="size_select"){
    if(!product||!variantId||product.source==="demo")return;

  function supplyIntentForSelection(product,variantId){
    const summary=variantInventorySummary(variantId);
    const checkoutMode=state.supply.checkoutMode||CONFIG.defaultCheckoutMode;
    const nativeDefaultOnly=checkoutMode==="DEFAULT_LOCATION_NATIVE";

    return{
      model:"CATALOG_V3_VARIANT_LOCATION",
      checkoutMode,
      productId:product?.id||null,
      variantId:variantId||null,
      supplyRef:product?.supplyRef||null,
      preferredLocationId:summary.preferredLocationId,
      candidateLocationIds:summary.candidateLocationIds,
      defaultLocationId:state.supply.defaultLocationId,
      defaultLocationQuantity:summary.defaultLocationQuantity,
      locationDataAvailable:summary.hasLocationData,
      sellableAcrossLocations:summary.sellable,
      preorderOnly:summary.preorderOnly,
      nativeCheckoutUsesDefaultLocation:nativeDefaultOnly
    };
  }

  function selectedVariantInventorySummary(){
    return state.selectedVariantId
      ?variantInventorySummary(state.selectedVariantId)
      :null;
  }

  function renderInventoryHint(){
    const hint=$("inventoryHint");
    const textNode=$("inventoryHintText");

    if(!hint||!textNode||!state.selectedVariantId){
      hint?.classList.remove("show","low","preorder","out");
      return;
    }

    const summary=variantInventorySummary(state.selectedVariantId);
    hint.classList.remove("show","low","preorder","out");

    if(!summary.hasLocationData)return;

    hint.classList.add("show");

    if(!summary.sellable){
      hint.classList.add("out");
      textNode.textContent="Sin disponibilidad confirmada.";
      return;
    }

    if(summary.preorderOnly){
      hint.classList.add("preorder");
      textNode.textContent="Disponible por pedido anticipado.";
      return;
    }

    if(summary.lowStock){
      hint.classList.add("low");
      textNode.textContent="Pocas unidades disponibles.";
      return;
    }

    textNode.textContent="Disponibilidad confirmada.";
  }

  function applySupplyContext(payload={}){
    state.supply.enabled=payload.enabled!==false;

    const requestedMode=
      payload.checkoutMode||
      payload.inventoryCheckoutMode||
      state.supply.checkoutMode;

    state.supply.checkoutMode=
      CONFIG.supportedCheckoutModes.includes(requestedMode)
        ?requestedMode
        :CONFIG.defaultCheckoutMode;

    state.supply.defaultLocationId=
      payload.defaultLocationId||
      state.supply.defaultLocationId;

    state.supply.supportsLocationInventory=
      payload.supportsLocationInventory!==false;

    state.supply.supportsReservations=
      !!payload.supportsReservations;

    state.supply.supportsPreorder=
      !!payload.supportsPreorder;

    state.supply.supportsCustomMultiLocationCheckout=
      !!payload.supportsCustomMultiLocationCheckout;

    state.supply.lastGlobalSyncAt=
      payload.lastSyncAt||
      state.supply.lastGlobalSyncAt;

    if(Array.isArray(payload.locations)){
      upsertStoresLocations(payload.locations);
    }

    if(Array.isArray(payload.inventoryItems)){
      upsertInventoryItems(payload.inventoryItems);
    }

    track("SUPPLY_CONTEXT_READY",null,{
      meta:{
        checkoutMode:state.supply.checkoutMode,
        locationCount:state.supply.locations.size,
        supportsLocationInventory:state.supply.supportsLocationInventory
      }
    });
  }

  function applyStoresLocations(payload={}){
    const locations=payload.locations||payload.items||[];
    if(!Array.isArray(locations))return;

    upsertStoresLocations(locations);

    if(payload.defaultLocationId){
      state.supply.defaultLocationId=payload.defaultLocationId;
    }

    track("STORES_LOCATIONS_SYNC",null,{
      meta:{count:locations.length}
    });
  }

  function applyProductSupply(payload={}){
    const productId=payload.productId||payload.id;
    if(!productId)return;

    if(Array.isArray(payload.locations)){
      upsertStoresLocations(payload.locations);
    }

    if(Array.isArray(payload.inventoryItems)){
      upsertInventoryItems(
        payload.inventoryItems,
        {replaceForProductId:productId}
      );
    }

    state.supply.productSupplyUpdatedAt.set(
      String(productId),
      Date.now()
    );

    state.supply.supportsLocationInventory=true;

    const productIndex=
      state.products.findIndex(
        product=>String(product.id)===String(productId)
      );

    if(productIndex>=0){
      const current=state.products[productIndex];

      state.products[productIndex]=normalizeProduct({
        ...current,
        inventoryMode:
          payload.inventoryMode??
          current.inventoryMode,
        inventoryStatus:
          payload.inventoryStatus??
          current.inventoryStatus,
        fulfillmentConfidence:
          payload.fulfillmentConfidence??
          current.fulfillmentConfidence,
        supplyRef:
          payload.supplyRef??
          current.supplyRef,
        defaultLocationId:
          payload.defaultLocationId??
          current.defaultLocationId,
        supplySyncAt:
          payload.supplySyncAt||
          payload.updatedAt||
          current.supplySyncAt
      });
    }

    if(
      state.activeProduct&&
      String(state.activeProduct.id)===String(productId)
    ){
      state.activeProduct=
        findProduct(productId)||
        state.activeProduct;

      renderSizes();
      renderInventoryHint();
    }

    track(
      "PRODUCT_SUPPLY_SYNC",
      findProduct(productId),
      {
        meta:{
          inventoryItemCount:
            Array.isArray(payload.inventoryItems)
              ?payload.inventoryItems.length
              :0,
          locationCount:
            Array.isArray(payload.locations)
              ?payload.locations.length
              :0
        }
      }
    );
  }

  function applyVariantInventory(payload={}){
    const productId=
      payload.productId||
      state.activeProduct?.id;

    const variantId=payload.variantId;

    if(Array.isArray(payload.locations)){
      upsertStoresLocations(payload.locations);
    }

    if(Array.isArray(payload.inventoryItems)){
      upsertInventoryItems(payload.inventoryItems);
    }

    if(productId){
      state.supply.productSupplyUpdatedAt.set(
        String(productId),
        Date.now()
      );
    }

    renderSizes();
    renderInventoryHint();

    track(
      "VARIANT_INVENTORY_SYNC",
      findProduct(productId),
      {
        variantId,
        meta:{
          inventoryItemCount:
            Array.isArray(payload.inventoryItems)
              ?payload.inventoryItems.length
              :0
        }
      }
    );
  }

  function applyInventoryPatch(payload={}){
    const items=
      payload.inventoryItems||
      payload.items||
      [];

    if(!Array.isArray(items))return;

    upsertInventoryItems(items);

    const productIds=[
      ...new Set(
        items
          .map(item=>item.productId)
          .filter(Boolean)
          .map(String)
      )
    ];

    productIds.forEach(id=>{
      state.supply.productSupplyUpdatedAt.set(
        id,
        Date.now()
      );
    });

    if(state.activeProduct){
      renderSizes();
      renderInventoryHint();
    }

    track(
      "INVENTORY_PATCH_APPLIED",
      state.activeProduct,
      {meta:{count:items.length}}
    );
  }

  function applyLocationPatch(payload={}){
    const locations=
      payload.locations||
      payload.items||
      [];

    if(!Array.isArray(locations))return;

    upsertStoresLocations(locations);

    if(payload.defaultLocationId){
      state.supply.defaultLocationId=
        payload.defaultLocationId;
    }

    rebuildInventoryByVariant();

    if(state.activeProduct){
      renderSizes();
      renderInventoryHint();
    }
  }

  function getVibe(id){
    return VIBES.find(v=>v.id===id)||VIBES[0];
  }

  function findProduct(id){
    return state.products.find(
      product=>String(product.id)===String(id)
    )||null;
  }

  function currentCartCount(){
    const explicit=Number(state.cart.count);
    if(Number.isFinite(explicit))return explicit;

    return state.cart.items.reduce(

      0
    );

  function postRaw(type,payload={}){
    const message={
      source:CONFIG.bridgeSource,
      type,
      payload
    };
        const targetOrigin=
      state.bridge.targetOrigin||
      "*";

    try{
      window.parent.postMessage(
        message,
        targetOrigin
      );
    }catch{
      window.parent.postMessage(
        message,
        "*"
      );
    }
  }

  function post(
    type,
    payload={},
    {queueUntilReady=false}={}
  ){
    if(
      queueUntilReady&&
      !state.bridge.ready
    ){
      state.bridge.queuedMessages.push({
        type,
        payload
      });
      return;
    }

    postRaw(type,payload);
  }

  function flushBridgeQueue(){
    const queued=[
      ...state.bridge.queuedMessages
    ];

    state.bridge.queuedMessages.length=0;

    queued.forEach(message=>{
      postRaw(
        message.type,
        message.payload
      );
    });
  }

  function track(
    eventType,
    product=null,
    extra={}
  ){
    const item=
      product||

  function productMatches(
    product,
    vibeId
  ){
    if(product.vibeId!==vibeId){
      return false;
    }

    if(
      state.selectedType!=="Todos"&&
      product.productType!==state.selectedType
    ){
      return false;
    }

    const q=
      state.searchQuery
        .trim()
        .toLowerCase();

    if(!q)return true;

    const haystack=
      `${product.name} ${product.productType} ${getVibe(product.vibeId).name} ${product.description}`
        .toLowerCase();

    return haystack.includes(q);
  }

  function updateRailDots(rail){
    const dots=
      qsa(
        ".productDot",
        rail.closest(".productSection")
      );

    if(!dots.length)return;

    const max=
      rail.scrollWidth-
      rail.clientWidth;

    const ratio=
      max>0
        ?rail.scrollLeft/max
        :0;

    const active=
      Math.min(
        dots.length-1,
        Math.round(
          ratio*(dots.length-1)
        )
      );

    dots.forEach(
      (dot,index)=>
        dot.classList.toggle(
          "active",
          index===active
        )
    );
  }

  function observeProductImpressions(){
    state.impressionObserver?.disconnect();

    if(
      !("IntersectionObserver" in window)
    ){
      return;
    }

    state.impressionObserver=
      new IntersectionObserver(
        entries=>{
          entries.forEach(entry=>{
            if(
              !entry.isIntersecting||
              entry.intersectionRatio<
                CONFIG.impressionThreshold
            ){
              return;
            }

            const productId=
              entry.target.dataset.productCard;

            const product=
              findProduct(productId);

            if(!product)return;

            const key=
              `${product.id}|${state.selectedType}|${state.searchQuery}|${state.activeVibe}`;

            if(
              state.impressionsSeen.has(key)
            ){
              return;
            }

            state.impressionsSeen.add(key);

            track(
              "PRODUCT_IMPRESSION",
              product,
              {
                meta:{
                  surface:"home"
                }
              }
            );
          });
        },
        {
          threshold:[
            CONFIG.impressionThreshold
          ]
        }
      );

    qsa("[data-product-card]").forEach(
      card=>
        state.impressionObserver.observe(
          card
        )
    );
  }

  function flushProductDwell(reason){
    if(
      !state.activeProduct||
      state.productOpenedAt==null
    ){
      return;
    }

    const seconds=
      Math.max(
        0,
        (
          performance.now()-
          state.productOpenedAt
        )/1000
      );

    track(
      "PRODUCT_DWELL",
      state.activeProduct,
      {
        value:
          Number(
            seconds.toFixed(2)
          ),
        meta:{reason}
      }
    );

    state.productOpenedAt=null;
  }

  function buildSizeModels(product){
    if(
      Array.isArray(product.variants)&&
      product.variants.length
    ){
      const map=
        new Map();

      product.variants.forEach(
        variant=>{
          if(
            !variant.size||
            map.has(variant.size)
          ){
            return;
          }

          const summary=
            variantInventorySummary(
              variant.id
            );

          const locationAvailability=
            summary.hasLocationData
              ?summary.sellable
              :null;

          map.set(
            variant.size,
            {
              size:variant.size,
              variantId:variant.id,
              available:
                locationAvailability==null
                  ?variant.inStock!==false
                  :locationAvailability,
              inventorySummary:summary
            }
          );
        }
      );

      if(map.size){
        return [...map.values()];
      }
    }

    return(
      product.sizes||
      []
    ).map(
      size=>({
        size,
        variantId:null,
        available:true,
        inventorySummary:null
      })
    );
  }

  function findVariantForSize(product,size){
    return(
      product.variants||
      []
    ).find(
      variant=>
        String(

          ""
        ).toLowerCase()===
        String(
          size||

  function selectSize(
    size,
    explicitVariantId=null
  ){
    const product=
      state.activeProduct;

    if(!product)return;

    const variant=
      explicitVariantId
        ?(
          product.variants||
          []
        ).find(
          item=>
            String(item.id)===
            String(explicitVariantId)
        )||null
        :findVariantForSize(
          product,
          size
        );

    state.selectedSize=size;

    state.selectedVariantId=
      explicitVariantId||
      variant?.id||
      null;

    renderSizes();

    if(
      state.selectedVariantId&&
      !isSupplySnapshotFresh(
        product.id
      )
    ){
      requestVariantInventory(
        product,
        state.selectedVariantId,
        "size_select"
      );
    }

    const inventorySummary=
      selectedVariantInventorySummary();

    renderInventoryHint();

    if(
      inventorySummary?.hasLocationData&&
      inventorySummary.sellable===false
    ){
      track(
        "SIZE_UNAVAILABLE",
        product,
        {
          variantId:
            state.selectedVariantId,
          meta:{size}
        }
      );

      showToast(
        "Esta talla no tiene disponibilidad confirmada."
      );

      return;
    }

    track(
      "SIZE_SELECT",
      product,
      {
        variantId:
          state.selectedVariantId,
        meta:{
          size,
          deliveryMethod:
            state.selectedDeliveryMethod
        }
      }
    );

    if(product.source==="demo"){
      showToast(
        `Talla ${size} seleccionada · producto de demostración`
      );
      return;
    }

    synchronizeSelectedVariant();
  }

  function findCartLineForProduct(productId){
    return state.cart.items.find(
      item=>
        String(item.productId)===
        String(productId)
    )||null;
  }

  function synchronizeSelectedVariant(){
    const product=
      state.activeProduct;

    if(
      !product||
      !state.selectedSize
    ){
      return;
    }

    const existingLine=
      findCartLineForProduct(
        product.id
      );

    const existingVariantId=
      existingLine?.variantId||
      null;

    const sameVariant=
      !!existingLine&&
      String(
        existingVariantId||
        ""
      )===
      String(
        state.selectedVariantId||
        ""
      );

    const expectedBehavior=
      existingLine
        ?(
          sameVariant
            ?"NO_DUPLICATE"
            :"REPLACE_VARIANT"
        )
        :"ADD_PRODUCT";

    state.pendingCartMutation={
      mutationId:createId(),
      productId:product.id,
      variantId:
        state.selectedVariantId,
      previousVariantId:
        existingVariantId,
      size:
        state.selectedSize,
      deliveryMethod:
        state.selectedDeliveryMethod,
      expectedBehavior,
      cartCountBefore:
        currentCartCount(),
      startedAt:
        Date.now()
    };

    const supplyIntent=
      supplyIntentForSelection(
        product,
        state.selectedVariantId
      );

    post(
      "SYNC_BAG_SELECTION",
      {
        productId:product.id,
        variantId:
          state.selectedVariantId,
        previousVariantId:
          existingVariantId,
        lineItemId:
          existingLine?.id||
          null,
        size:
          state.selectedSize,
        deliveryMode:
          state.selectedDeliveryMethod,
        quantity:1,
        replaceExistingVariant:
          !!existingLine&&
          !sameVariant,
        preventDuplicate:true,
        sellerId:
          state.context.sellerId,
        storefrontId:
          state.context.storefrontId,
        storefrontSlug:
          state.context.storefrontSlug,
        supplyIntent
      }
    );

    track(
      "ADD_TO_BAG_INTENT",
      product,
      {
        variantId:
          state.selectedVariantId,
        meta:{
          size:
            state.selectedSize,
          expectedBehavior,
          existingLineItemId:
            existingLine?.id||
            null,
          deliveryMethod:
            state.selectedDeliveryMethod,
          supplyIntent
        }
      }
    );
  }

  function swipeProduct(direction) {
    const list = activeProductList();
    if (!list.length) return;
    flushProductDwell(direction > 0 ? "swipe_next" : "swipe_previous");

    state.activeProductIndex = (state.activeProductIndex + direction + list.length) % list.length;
    state.activeProduct = list[state.activeProductIndex];
    state.activeMediaIndex = 0;
    state.selectedSize = "";
    state.selectedVariantId = null;
    state.selectedDeliveryMethod = state.activeProduct.deliveryModes?.[0] || "";
    state.detailDeliveryOpen = null;
    closeDetailsCapsule();
    renderProduct();

    track("PRODUCT_SWIPE", state.activeProduct, { meta: { direction: direction > 0 ? "next" : "previous" } });
    track("PRODUCT_VIEW", state.activeProduct, { meta: { surface: "swipe" } });
    startProductDwell();

    if (state.activeProduct.source !== "demo") {
      post("REQUEST_VARIANTS", { productId: state.activeProduct.id });
      post("REQUEST_PRODUCT_META", { productId: state.activeProduct.id });
      requestProductSupply(state.activeProduct, "product_swipe");
    }

  async function shareActiveProduct() {

    track("SHARE", product, { meta: { surface: "product" } });
    const shareData = { title: product.name, text: `Mira este look: ${product.name}`, url: location.href };
    try {

        await navigator.share(shareData);

  function clearPurchaseValidationTimer() {
    if (state.purchaseValidationTimer) clearTimeout(state.purchaseValidationTimer);
    state.purchaseValidationTimer = null;
  }

  function continuePurchaseWithPath(pathState = {}) {
    const intent = state.pendingPurchaseIntent;
    if (!intent) return;
    clearPurchaseValidationTimer();

    const product = findProduct(intent.productId) || state.activeProduct;
    if (!product) {
      state.pendingPurchaseIntent = null;
      hideWorking();
      $("buyButton").classList.remove("working");
      return;
    }

    if (pathState.sellable === false || pathState.allowed === false) {
      track("PURCHASE_BLOCKED_BY_SUPPLY", product, {
        variantId: intent.variantId,
        meta: { reason: pathState.reason || "SUPPLY_UNAVAILABLE", pathState }
      });

      state.pendingPurchaseIntent = null;
      hideWorking();
      $("buyButton").classList.remove("working");
      showToast(pathState.message || "No pudimos confirmar disponibilidad para esta talla.");
      return;
    }

    const resolvedMode =
      pathState.checkoutMode ||
      pathState.mode ||
      state.supply.checkoutMode ||
      CONFIG.defaultCheckoutMode;

    const supplyIntent =
      pathState.supplyIntent ||
      intent.supplyIntent;

    track("PURCHASE_PATH_CONFIRMED", product, {
      variantId: intent.variantId,
      meta: { checkoutMode: resolvedMode, supplyIntent }
    });

    post("BUY_NOW", {
      productId: intent.productId,
      variantId: intent.variantId,
      size: intent.size,
      deliveryMode: intent.deliveryMode,
      quantity: 1,
      sellerId: state.context.sellerId,
      storefrontId: state.context.storefrontId,
      storefrontSlug: state.context.storefrontSlug,
      checkoutMode: resolvedMode,
      supplyIntent
    });

    state.pendingPurchaseIntent = null;
  }

  function handleBuyNow() {
    const product = state.activeProduct;
    if (!product) return;

    if (state.selectedDeliveryMethod === "reserve") {
      track("RESERVE_RELEASE_START", product, { meta: { size: state.selectedSize || null } });

      post("RESERVE_RELEASE", {
        productId: product.id,
        productName: product.name,
        category: product.productType,
        size: state.selectedSize || null,
        sellerId: state.context.sellerId,
        storefrontId: state.context.storefrontId
      });

      showWorking("Registrando reserva…");
      return;
    }

    if (!state.selectedSize) {
      showToast("Elige una talla para continuar.");
      return;
    }

    if (product.source === "demo") {
      showToast("Conecta un producto real de Wix para comprar.");
      return;
    }

    const summary = selectedVariantInventorySummary();

    if (summary?.hasLocationData && summary.sellable === false) {
      showToast("No hay disponibilidad confirmada para esta talla.");

      track("PURCHASE_BLOCKED_BY_SUPPLY", product, {
        variantId: state.selectedVariantId,
        meta: { reason: "NO_SELLABLE_LOCATION" }
      });

      return;
    }

    const supplyIntent =
      supplyIntentForSelection(
        product,
        state.selectedVariantId
      );

    state.pendingPurchaseIntent = {
      intentId: createId(),
      productId: product.id,
      variantId: state.selectedVariantId,
      size: state.selectedSize,
      deliveryMode: state.selectedDeliveryMethod,
      supplyIntent,
      createdAt: Date.now()
    };

    $("buyButton").classList.add("working");
    showWorking("Confirmando disponibilidad…");

    track("BUY_NOW", product, {
      variantId: state.selectedVariantId,
      meta: {
        size: state.selectedSize,
        deliveryMethod: state.selectedDeliveryMethod,
        supplyIntent
      }
    });

    post("VALIDATE_PURCHASE_PATH", {
      ...state.pendingPurchaseIntent,
      sellerId: state.context.sellerId,
      storefrontId: state.context.storefrontId,
      storefrontSlug: state.context.storefrontSlug,
      requestedCheckoutMode: state.supply.checkoutMode
    });

    clearPurchaseValidationTimer();

    state.purchaseValidationTimer = setTimeout(() => {
      if (!state.pendingPurchaseIntent) return;

      if (state.supply.checkoutMode === "DEFAULT_LOCATION_NATIVE") {
        continuePurchaseWithPath({
          allowed: true,
          checkoutMode: "DEFAULT_LOCATION_NATIVE",
          supplyIntent: state.pendingPurchaseIntent.supplyIntent,
          fallback: true
        });
      } else {
        state.pendingPurchaseIntent = null;
        hideWorking();
        $("buyButton").classList.remove("working");
        showToast("No pudimos validar la ruta de inventario. Intenta nuevamente.");
      }
    }, CONFIG.supplyValidationTimeoutMs);
  }

  function normalizeCart(payload) {
    const raw =
      payload?.cart ||
      payload ||
      {};

    const lineItems =
      raw.items ||
      raw.lineItems ||
      [];

    const items = lineItems.map(item => ({
      id:
        item.id ||
        item._id ||
        item.lineItemId,

      productId:
        item.productId ||
        item.catalogReference?.catalogItemId ||
        item.catalogItemId ||
        null,

      variantId:
        item.variantId ||
        item.catalogReference?.variantId ||
        item.catalogReference?.options?.variantId ||
        null,

      name:
        item.name ||
        item.productName ||
        item.itemName ||
        "Producto",

      image:
        item.image ||
        item.media?.url ||
        item.imageUrl ||
        "",

      size:
        item.size ||
        item.options?.Size ||
        item.options?.size ||
        item.selectedOptions?.Size ||
        item.selectedOptions?.size ||
        "",

      deliveryMode:
        item.deliveryMode ||
        item.mode ||
        "",

      quantity:
        Number(
          item.quantity ||
          1
        ),

      price:
        Number(
          item.price?.amount ??
          item.price ??
          item.lineItemPrice?.amount ??
          0
        )
    }));

    const count =
      Number(
        raw.count ??
        raw.totalQuantity ??
        items.reduce(
          (sum,item) =>
            sum + item.quantity,
          0
        )
      );

    const total =
      Number(
        raw.total?.amount ??
        raw.subtotal?.amount ??
        raw.total ??
        items.reduce(
          (sum,item) =>
            sum +
            item.price *
            item.quantity,
          0
        )
      );

    return {
      items,
      count,
      total
    };
  }

    qsa("[data-qty-line]").forEach(
      button => {
        button.onclick = () => {
          const line =
            items.find(
              item =>
                String(item.id) ===
                String(button.dataset.qtyLine)
            );

          if (!line) return;

          const nextQuantity =
            line.quantity +
            Number(button.dataset.delta);

          if (nextQuantity <= 0) {
            return removeCartLine(line);
          }

          post(
            "UPDATE_BAG_QUANTITY",
            {
              lineItemId: line.id,
              quantity: nextQuantity
            }
          );

          track(
            "CART_QUANTITY_CHANGE",
            findProduct(line.productId),
            {
              variantId: line.variantId,
              value: nextQuantity,
              meta: {
                previousQuantity:
                  line.quantity,
                nextQuantity
              }
            }
          );
        };
      }
    );

    qsa("[data-remove-line]").forEach(
      button => {
        button.onclick = () => {
          const line =
            items.find(
              item =>
                String(item.id) ===
                String(button.dataset.removeLine)
            );

          if (line) {
            removeCartLine(line);
          }
        };
      }
    );
  }

  function resolvePendingCartMutation() {
    const mutation =
      state.pendingCartMutation;

    if (!mutation) return;

    const product =
      findProduct(
        mutation.productId
      );

    const nextCount =
      currentCartCount();

    const updatedLine =
      findCartLineForProduct(
        mutation.productId
      );

    const eventType =
      mutation.expectedBehavior ===
      "REPLACE_VARIANT"
        ? "CART_VARIANT_REPLACED"
        : mutation.expectedBehavior ===
          "NO_DUPLICATE"
          ? "CART_SELECTION_CONFIRMED"
          : "ADD_TO_BAG";

    track(
      eventType,
      product,
      {
        variantId:
          mutation.variantId,

        meta: {
          size:
            mutation.size,

          previousVariantId:
            mutation.previousVariantId,

          deliveryMethod:
            mutation.deliveryMethod,

          cartCountBefore:
            mutation.cartCountBefore,

          cartCountAfter:
            nextCount,

          lineItemId:
            updatedLine?.id ||
            null
        }
      }
    );

    if (navigator.vibrate) {
      navigator.vibrate(28);
    }

    showToast(
      mutation.expectedBehavior ===
      "REPLACE_VARIANT"
        ? "Talla actualizada"
        : mutation.expectedBehavior ===
          "NO_DUPLICATE"
          ? "Selección confirmada"
          : "Agregado a tu bolsa"
    );

    state.pendingCartMutation = null;
  }
