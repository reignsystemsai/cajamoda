<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">

<title>CajaModa Colombia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#ffffff;
  --ink:#090909;
  --ink-soft:#343434;
  --muted:#777777;
  --muted-light:#a0a0a0;
  --line:rgba(0,0,0,.07);
  --line-strong:rgba(0,0,0,.12);
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.88);
  --shadow:0 12px 35px rgba(0,0,0,.065);
  --shadow-strong:0 22px 55px rgba(0,0,0,.11);
  --mobile-max:430px;
  --nav-h:62px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
  box-sizing:border-box;
}

html{
  margin:0;
  width:100%;
  min-height:100%;
  scroll-behavior:smooth;
  background:#fff;
}

body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  background:#fff;
  color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

body.locked{
  overflow:hidden;
}

button,
input{
  font:inherit;
  color:inherit;
}

button{
  border:0;
  margin:0;
  padding:0;
  background:none;
  cursor:pointer;
}

input{
  border:0;
  outline:0;
  background:none;
}

img{
  display:block;
  max-width:100%;
  user-select:none;
  -webkit-user-drag:none;
}

svg{
  display:block;
  pointer-events:none;
}

.hidden{
  display:none!important;
}

.appShell{
  position:relative;
  width:100%;
  min-height:100dvh;
  margin:0 auto;
  padding-bottom:calc(var(--nav-h) + 28px + var(--safe-bottom));
  background:#fff;
}

@media(min-width:700px){
  body{
    background:#f5f5f5;
  }

  .appShell{
    width:min(100%,var(--mobile-max));
    box-shadow:0 0 70px rgba(0,0,0,.08);
  }
}

.glass{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.87),
    rgba(255,255,255,.45)
  );

  border:1px solid rgba(255,255,255,.95);

  box-shadow:
    0 0 0 1px rgba(0,0,0,.035),
    inset 0 1px 0 rgba(255,255,255,.98),
    var(--shadow);

  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
}

.glassStrong{
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.96),
    rgba(255,255,255,.68)
  );

  border:1px solid rgba(255,255,255,.98);

  box-shadow:
    0 0 0 1px rgba(0,0,0,.05),
    inset 0 1px 0 #fff,
    var(--shadow-strong);

  backdrop-filter:blur(30px) saturate(175%);
  -webkit-backdrop-filter:blur(30px) saturate(175%);
}

/* =========================================================
   HEADER
   ========================================================= */

.homeHeader{
  position:relative;
  height:118px;
  padding-top:var(--safe-top);
}

.headerPlus{
  position:absolute;
  left:15px;
  top:calc(27px + var(--safe-top));

  width:40px;
  height:40px;

  border-radius:50%;

  display:grid;
  place-items:center;

  transition:
    transform .16s ease,
    background .16s ease;
}

.headerPlus:active{
  transform:scale(.94);
}

.headerPlus svg{
  width:21px;
  height:21px;
  stroke-width:1.45;
}

/* =========================================================
   CAJAMODA LOGO
   ========================================================= */

.brandLockup{
  position:absolute;
  top:calc(8px + var(--safe-top));
  left:50%;
  transform:translateX(-50%);

  width:190px;

  display:flex;
  flex-direction:column;
  align-items:center;

  pointer-events:none;
}

.brandMonogram{
  position:relative;

  width:104px;
  height:56px;

  font-family:"Times New Roman",Georgia,serif;
}

.brandC{
  position:absolute;
  left:11px;
  top:-5px;

  font-size:65px;
  line-height:1;
  font-weight:400;

  transform:scaleX(.88);
}

.brandM{
  position:absolute;
  left:43px;
  top:7px;

  font-size:53px;
  line-height:1;
  font-weight:400;

  transform:scaleX(.84);
}

.brandWord{
  margin-top:-1px;

  font-family:"Times New Roman",Georgia,serif;

  font-size:10px;
  line-height:1;

  font-weight:500;

  letter-spacing:4.8px;

  padding-left:5px;
}

.brandCountryRow{
  width:145px;

  margin-top:6px;

  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;

  gap:8px;
}

.brandCountryLine{
  height:1px;
  background:rgba(0,0,0,.58);
}

.brandCountry{
  font-size:6.5px;
  line-height:1;

  font-weight:600;

  letter-spacing:3.1px;

  padding-left:3px;
}

/* =========================================================
   BAG TOP
   ========================================================= */

.homeBagTop{
  position:absolute;

  top:calc(27px + var(--safe-top));
  right:14px;

  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border-radius:50%;
}

.homeBagTop svg{
  width:24px;
  height:24px;
  stroke-width:1.5;
}

.bagBadge{
  position:absolute;

  top:-2px;
  right:-2px;

  min-width:18px;
  height:18px;

  padding:0 4px;

  display:grid;
  place-items:center;

  border-radius:999px;

  background:#090909;
  color:#fff;

  border:2px solid #fff;

  font-size:8px;
  font-weight:800;
}

/* =========================================================
   HOME CONTENT
   ========================================================= */

.homeContent{
  padding:0 12px;
}

/* =========================================================
   CATEGORY ANCHOR PHOTOS
   ========================================================= */

.categoryAnchors{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));

  gap:6px;

  margin-top:1px;
}

.categoryAnchor{
  position:relative;

  aspect-ratio:.70;

  overflow:hidden;

  border-radius:10px;

  background:#ededed;

  box-shadow:0 7px 20px rgba(0,0,0,.065);

  transition:
    transform .16s ease,
    outline-color .16s ease;
}

.categoryAnchor:active{
  transform:scale(.98);
}

.categoryAnchor img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.categoryAnchor::after{
  content:"";

  position:absolute;
  inset:0;

  background:linear-gradient(
    to bottom,
    transparent 40%,
    rgba(0,0,0,.68) 100%
  );
}

.categoryAnchorLabel{
  position:absolute;
  z-index:2;

  left:4px;
  right:4px;
  bottom:10px;

  text-align:center;

  color:#fff;

  font-size:9px;
  line-height:1.03;

  font-weight:800;

  text-transform:uppercase;
}

.categoryAnchor.active{
  outline:1.5px solid rgba(0,0,0,.72);
  outline-offset:2px;
}

/* =========================================================
   DELIVERY
   ========================================================= */

.deliverySection{
  margin-top:9px;
}

.deliveryRail{
  display:grid;

  grid-template-columns:repeat(4,minmax(0,1fr));

  gap:6px;
}

.deliveryCard{
  min-height:90px;

  padding:10px 6px 8px;

  border-radius:13px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.deliveryIcon{
  width:26px;
  height:26px;

  margin-bottom:7px;
}

.deliveryIcon svg{
  width:100%;
  height:100%;
  stroke-width:1.5;
}

.deliveryTitle{
  font-size:8.3px;
  line-height:1.2;
  font-weight:700;
}

.deliveryEta{
  margin-top:3px;

  font-size:7.4px;
  line-height:1.2;

  color:var(--muted);
}

.deliveryInfo{
  display:none;

  position:relative;

  margin-top:7px;

  padding:11px 38px 11px 12px;

  border-radius:15px;
}

.deliveryInfo.open{
  display:block;
}

.deliveryInfoTitle{
  font-size:9.5px;
  font-weight:800;
}

.deliveryInfoText{
  margin-top:4px;

  font-size:8px;
  line-height:1.45;

  color:#555;
}

.deliveryInfoClose{
  position:absolute;

  right:7px;
  top:50%;

  transform:translateY(-50%);

  width:28px;
  height:28px;

  border-radius:50%;

  display:grid;
  place-items:center;
}

.deliveryInfoClose svg{
  width:14px;
  height:14px;
  stroke-width:1.5;
}

/* =========================================================
   SEARCH
   ========================================================= */

.searchShell{
  height:48px;

  margin-top:10px;

  border-radius:15px;

  display:flex;
  align-items:center;

  gap:9px;

  padding:0 10px 0 13px;
}

.searchIcon{
  width:19px;
  height:19px;

  flex:0 0 auto;

  stroke-width:1.5;
}

.searchInput{
  flex:1;

  min-width:0;

  height:44px;

  font-size:9.5px;
}

.searchInput::placeholder{
  color:#999;
}

.searchClear{
  display:none;

  width:28px;
  height:28px;

  border-radius:50%;

  place-items:center;
}

.searchClear.show{
  display:grid;
}

.searchClear svg{
  width:13px;
  height:13px;
  stroke-width:1.5;
}

.filterButton{
  width:31px;
  height:31px;

  border-radius:50%;

  display:grid;
  place-items:center;
}

.filterButton svg{
  width:18px;
  height:18px;
  stroke-width:1.5;
}

.searchStatus{
  display:none;

  margin-top:7px;

  padding:7px 9px;

  border-radius:10px;

  background:#fafafa;

  border:1px solid rgba(0,0,0,.05);

  font-size:7.5px;

  color:#777;
}

.searchStatus.show{
  display:block;
}

/* =========================================================
   CATEGORY TABS
   ========================================================= */

.categoryTabs{
  display:flex;
  align-items:center;

  margin-top:7px;

  overflow-x:auto;

  border-bottom:1px solid rgba(0,0,0,.055);

  scrollbar-width:none;

  -webkit-overflow-scrolling:touch;
}

.categoryTabs::-webkit-scrollbar{
  display:none;
}

.categoryTab{
  position:relative;

  flex:0 0 auto;

  min-width:92px;

  height:39px;

  padding:0 9px;

  white-space:nowrap;

  font-size:7.9px;

  text-transform:uppercase;

  color:#777;
}

.categoryTab.all{
  min-width:55px;
}

.categoryTab.active{
  color:#090909;

  font-weight:750;
}

.categoryTab.active::after{
  content:"";

  position:absolute;

  left:10px;
  right:10px;
  bottom:-1px;

  height:2px;

  border-radius:999px;

  background:#111;
}

/* =========================================================
   PRODUCT SECTIONS
   ========================================================= */

.productSection{
  margin-top:16px;

  scroll-margin-top:8px;
}

.productSectionHead{
  margin-bottom:8px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.productSectionTitle{
  margin:0;

  font-size:13px;

  font-weight:800;

  letter-spacing:-.15px;

  text-transform:uppercase;
}

.productSectionMeta{
  display:flex;
  align-items:center;

  gap:8px;
}

.liveCount{
  font-size:7px;

  color:#999;
}

.viewAll{
  font-size:8px;

  color:#333;
}

.productRail{
  display:grid;

  grid-auto-flow:column;

  grid-auto-columns:calc((100vw - 44px) / 3);

  gap:8px;

  overflow-x:auto;
  overflow-y:hidden;

  padding-bottom:2px;

  scroll-snap-type:x mandatory;

  overscroll-behavior-x:contain;

  touch-action:pan-x;

  -webkit-overflow-scrolling:touch;

  scrollbar-width:none;
}

.productRail::-webkit-scrollbar{
  display:none;
}

@media(min-width:700px){
  .productRail{
    grid-auto-columns:calc((var(--mobile-max) - 44px) / 3);
  }
}

/* =========================================================
   PRODUCT CARD
   ========================================================= */

.productCard{
  min-width:0;

  scroll-snap-align:start;

  border-radius:11px;

  overflow:hidden;

  background:#fff;

  box-shadow:0 5px 18px rgba(0,0,0,.045);
}

.productMedia{
  position:relative;

  aspect-ratio:.74;

  overflow:hidden;

  background:#eee;
}

.productMedia img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.productHeart{
  position:absolute;

  right:5px;
  top:5px;

  width:27px;
  height:27px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:rgba(255,255,255,.9);

  border:1px solid rgba(255,255,255,.96);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.productHeart svg{
  width:15px;
  height:15px;

  stroke-width:1.7;
}

.productHeart.active{
  color:#df1531;
}

.productInfo{
  min-height:54px;

  padding:6px 6px 8px;

  border:1px solid rgba(0,0,0,.055);

  border-top:0;
}

.productName{
  height:19px;

  overflow:hidden;

  font-size:7.8px;
  line-height:1.2;

  font-weight:550;
}

.productPrice{
  margin-top:3px;

  font-size:9.3px;

  font-weight:800;
}

/* =========================================================
   PLACEHOLDER CARD
   ========================================================= */

.placeholderCard{
  pointer-events:none;

  box-shadow:none;
}

.placeholderMedia{
  position:relative;

  width:100%;
  height:100%;

  display:grid;
  place-items:center;

  background:linear-gradient(
    145deg,
    #f7f7f7,
    #ededed
  );
}

.placeholderMedia::after{
  content:"";

  position:absolute;

  inset:9px;

  border:1px dashed rgba(0,0,0,.13);

  border-radius:9px;
}

.placeholderInner{
  position:relative;

  z-index:2;

  text-align:center;

  color:#9a9a9a;
}

.placeholderPlus{
  width:29px;
  height:29px;

  margin:0 auto 6px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:rgba(255,255,255,.78);

  box-shadow:0 2px 8px rgba(0,0,0,.04);

  font-size:17px;
  font-weight:300;
}

.placeholderLabel{
  font-size:6.3px;

  letter-spacing:.5px;

  text-transform:uppercase;

  font-weight:650;
}

.placeholderCard .productInfo{
  background:#fafafa;
}

.placeholderCard .productName{
  color:#999;
}

.placeholderCard .productPrice{
  color:#bbb;

  font-weight:500;
}

/* =========================================================
   RAIL DOTS
   ========================================================= */

.railDots{
  height:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:4px;
}

.railDot{
  width:4px;
  height:4px;

  border-radius:50%;

  background:#ddd;
}

.railDot.active{
  width:13px;

  border-radius:999px;

  background:#111;
}

/* =========================================================
   EMPTY SEARCH
   ========================================================= */

.emptySearch{
  min-height:180px;

  padding:30px 20px;

  display:grid;
  place-items:center;

  text-align:center;

  font-size:8.5px;
  line-height:1.55;

  color:#777;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottomNav{
  position:fixed;

  z-index:90;

  left:50%;

  bottom:max(7px,var(--safe-bottom));

  transform:translateX(-50%);

  width:min(calc(100% - 20px),410px);

  height:var(--nav-h);

  padding:4px 5px;

  border-radius:21px;

  display:grid;

  grid-template-columns:repeat(5,1fr);

  align-items:center;

  background:linear-gradient(
    145deg,
    rgba(255,255,255,.66),
    rgba(255,255,255,.30)
  );

  border:1px solid rgba(255,255,255,.92);

  box-shadow:
    0 0 0 1px rgba(0,0,0,.035),
    inset 0 1px 0 rgba(255,255,255,.96),
    0 10px 30px rgba(0,0,0,.085);

  backdrop-filter:blur(27px) saturate(165%);
  -webkit-backdrop-filter:blur(27px) saturate(165%);
}

.navButton{
  position:relative;

  height:50px;

  border-radius:17px;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:2px;
}

.navButton svg{
  width:20px;
  height:20px;

  stroke-width:1.5;
}

.navButton span{
  font-size:7.2px;
}

.navButton.active{
  background:rgba(255,255,255,.78);

  box-shadow:0 4px 17px rgba(0,0,0,.07);
}

.navHome.active{
  transform:translateY(-1px);
}

.navPlusOrb{
  width:31px;
  height:31px;

  display:grid;
  place-items:center;

  border-radius:50%;

  background:#111;

  color:#fff;

  box-shadow:0 7px 20px rgba(0,0,0,.15);
}

.navPlusOrb svg{
  width:17px;
  height:17px;
}

.navPlusLabel{
  display:none;
}

.navBagBadge{
  position:absolute;

  top:1px;

  right:calc(50% - 20px);

  min-width:16px;
  height:16px;

  padding:0 3px;

  border-radius:999px;

  background:#090909;
  color:#fff;

  border:1.5px solid #fff;

  display:grid;
  place-items:center;

  font-size:7px!important;

  font-weight:800;
}

/* =========================================================
   OVERLAY
   ========================================================= */

.overlay{
  position:fixed;

  inset:0;

  z-index:130;

  display:none;

  background:rgba(0,0,0,.12);

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}

.overlay.open{
  display:block;
}

/* =========================================================
   PLUS MENU
   ========================================================= */

.plusPanel{
  position:absolute;

  left:10px;
  right:10px;

  bottom:calc(var(--nav-h) + 18px + var(--safe-bottom));

  padding:14px;

  border-radius:24px;
}

.panelEyebrow{
  font-size:6.8px;

  color:#888;

  font-weight:800;

  letter-spacing:1.4px;

  text-transform:uppercase;
}

.panelTitle{
  margin-top:4px;

  font-size:15px;

  font-weight:800;
}

.plusGrid{
  display:grid;

  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:7px;

  margin-top:12px;
}

.plusTile{
  min-height:68px;

  padding:10px;

  border-radius:17px;

  text-align:left;

  display:flex;

  flex-direction:column;

  align-items:flex-start;

  justify-content:space-between;

  background:rgba(255,255,255,.58);

  border:1px solid rgba(0,0,0,.055);
}

.plusTileIcon{
  width:28px;
  height:28px;

  border-radius:50%;

  display:grid;
  place-items:center;

  background:rgba(0,0,0,.055);
}

.plusTileIcon svg{
  width:15px;
  height:15px;

  stroke-width:1.5;
}

.plusTileText{
  margin-top:7px;

  font-size:8.5px;

  font-weight:700;
}

.plusWide{
  grid-column:1 / -1;

  min-height:52px;

  flex-direction:row;

  align-items:center;
}

.plusWide .plusTileText{
  margin:0 0 0 8px;

  flex:1;
}

/* =========================================================
   FAVORITES PANEL
   ========================================================= */

.favoritesPanel{
  position:absolute;

  left:8px;
  right:8px;

  bottom:calc(var(--nav-h) + 15px + var(--safe-bottom));

  padding:13px;

  border-radius:23px;
}

.panelHead{
  display:flex;

  align-items:center;
  justify-content:space-between;
}

.panelHeadTitle{
  font-size:13px;

  font-weight:800;
}

.closeCircle{
  width:31px;
  height:31px;

  border-radius:50%;

  display:grid;
  place-items:center;
}

.closeCircle svg{
  width:15px;
  height:15px;

  stroke-width:1.5;
}

.favoriteRail{
  display:flex;

  gap:7px;

  margin-top:10px;

  overflow-x:auto;

  scrollbar-width:none;

  scroll-snap-type:x mandatory;
}

.favoriteRail::-webkit-scrollbar{
  display:none;
}

.favoriteMini{
  flex:0 0 93px;

  scroll-snap-align:start;
}

.favoriteMiniImage{
  position:relative;

  width:93px;
  height:116px;

  overflow:hidden;

  border-radius:11px;

  background:#eee;
}

.favoriteMiniImage img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.favoriteMiniName{
  margin-top:5px;

  font-size:7px;

  line-height:1.25;
}

.favoriteMiniPrice{
  margin-top:2px;

  font-size:8px;

  font-weight:800;
}

.favoriteEmpty{
  min-height:90px;

  display:grid;
  place-items:center;

  width:100%;

  text-align:center;

  color:#777;

  font-size:8.5px;
}

/* =========================================================
   PROFILE PANEL
   ========================================================= */

.profilePanel{
  position:absolute;

  left:8px;
  right:8px;
  bottom:8px;

<script>
(() => {

  "use strict";

  /* =========================================================

  const CONFIG = Object.freeze({

  const CATEGORIES = Object.freeze([

    {

      terms:[

        "top",

        "shirt",
        "shirts",
        "blouse",
        "blouses",
        "tee",
        "camisa",
        "blusa"
      ]
    },

    {
      id:
        "quick",

      name:
        "Quick and Easy",

      image:
        "https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=900&q=88",

      terms:[
        "quick and easy",
        "set",
        "sets",
        "matching set",
        "two piece",
        "two-piece",
        "conjunto",
        "conjuntos",
        "outfit"
      ]
    },

    {
      id:
        "sun",

      name:
        "Sunbathing",

      image:
        "https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?auto=format&fit=crop&w=900&q=88",

      terms:[
        "sunbathing",
        "bikini",
        "bikinis",
        "swim",
        "swimsuit",
        "swimwear",
        "beach",
        "jumpsuit",
        "romper",
        "enterizo"
      ]
    }

  ]);

  const DELIVERY_METHODS = Object.freeze([

    {
      id:
        "pickup",

      title:
        "Recoge en tienda",

      eta:
        "Local",

      description:
        "Compra en línea y recoge localmente cuando confirmemos que tu pedido está listo.",

      icon:
        "pin"
    },

    {
      id:
        "fast",

      title:
        "Entrega rápida",

      eta:
        "24–48 h",

      description:
        "Productos elegibles se procesan con prioridad para una entrega estimada de 24 a 48 horas.",

      icon:
        "truck"
    },

    {
      id:
        "ship",

      title:
        "Envíos",

      eta:
        "14–21 días",

      description:
        "Los productos conectados a nuestra red de suministro pueden requerir 14 a 21 días.",

      icon:
        "globe"
    },

    {
      id:
        "reserve",

      title:
        "Reserva el lanzamiento",

      eta:
        "Sé la primera",

      description:
        "Registra tu interés antes del lanzamiento para recibir noticias cuando el producto esté disponible.",

      icon:
        "spark"
    }

  ]);

  const $ =
    id =>
      document.getElementById(
        id
      );

  const qsa =
    (
      selector,
      root=document
    ) =>
      [
        ...root.querySelectorAll(
          selector
        )
      ];

  const state = {

    products:
      [],

    activeCategory:
      "late",

    search:
      "",

    favorites:
      new Set(
        readFavorites()
      ),

    searchTimer:
      null

  };

  /* =========================================================
     STORAGE
     ========================================================= */

  function readJson(
    key,
    fallback
  ){

    try{

      const raw =
        localStorage.getItem(
          key
        );

      if(
        !raw
      ){
        return fallback;
      }

      return JSON.parse(
        raw
      );

    }catch{

      return fallback;
    }
  }

  function saveJson(
    key,
    value
  ){

    try{

      localStorage.setItem(
        key,
        JSON.stringify(
          value
        )
      );

    }catch{}
  }

  function readFavorites(){

    const data =
      readJson(
        "cajamoda-favorites",
        []
      );

    return Array.isArray(
      data
    )
      ?data
        .map(String)
        .slice(
          0,
          CONFIG.maxFavorites
        )
      :[];
  }

  function saveFavorites(){

    saveJson(
      "cajamoda-favorites",
      [
        ...state.favorites
      ]
    );
  }

  function readBagCount(){

    const cart =
      readJson(
        "cajamoda-cart",
        {}
      );

    if(
      Array.isArray(
        cart.items
      )
    ){

      return cart.items.reduce(
        (
          sum,
          item
        ) =>
          sum +
          Number(
            item.quantity ||
            0
          ),
        0
      );
    }

    return Number(
      cart.count ||
      0
    );
  }

  /* =========================================================
     HELPERS
     ========================================================= */

  function createId(){

    if(
      window.crypto?.randomUUID
    ){
      return window.crypto
        .randomUUID();
    }

    return (
      `${Date.now()}-` +
      Math.random()
        .toString(16)
        .slice(2)
    );
  }

  function escapeHtml(
    value
  ){

    return String(
      value ??
      ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function normalizeText(
    value
  ){

    return String(
      value ||
      ""
    )
      .normalize(
        "NFD"
      )
      .replace(
        /[\u0300-\u036f]/g,
        ""
      )
      .toLowerCase()
      .replace(
        /[^a-z0-9]+/g,
        " "
      )
      .replace(
        /\s+/g,
        " "
      )
      .trim();
  }

  function money(
    value
  ){

    return new Intl.NumberFormat(
      "es-CO",
      {
        style:
          "currency",

        currency:
          "COP",

        maximumFractionDigits:
          0
      }
    ).format(
      Number(
        value ||
        0
      )
    );
  }

  function heartIcon(
    filled=false
  ){

    return `
      <svg
        viewBox="0 0 24 24"
        fill="${filled?"currentColor":"none"}"
        stroke="currentColor"
      >
        <path d="M20.3 5.7a5.2 5.2 0 0 0-7.4 0L12 6.6l-.9-.9a5.2 5.2 0 0 0-7.4 7.4L12 21l8.3-7.9a5.2 5.2 0 0 0 0-7.4Z"/>
      </svg>
    `;
  }

  function deliveryIcon(
    type
  ){

    if(
      type ===
      "pin"
    ){
      return `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>
      `;
    }

    if(
      type ===
      "truck"
    ){
      return `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 6h11v10H3z"/>
          <path d="M14 10h4l3 3v3h-7"/>
          <circle cx="7" cy="18" r="2"/>
          <circle cx="18" cy="18" r="2"/>
        </svg>
      `;
    }

    if(
      type ===
      "globe"
    ){
      return `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="9"/>
          <path d="M3 12h18"/>
          <path d="M12 3c3 3 4 6 4 9s-1 6-4 9"/>
          <path d="M12 3c-3 3-4 6-4 9s1 6 4 9"/>
        </svg>
      `;
    }

    return `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/>
        <path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15Z"/>
      </svg>
    `;
  }

  function categoryById(
    id
  ){

    return (
      CATEGORIES.find(
        category =>
          category.id ===
          id
      ) ||
      CATEGORIES[0]
    );
  }

  function inferCategory(
    product
  ){

    const explicit =
      normalizeText(
        product.vibeId ||
        product.vibe ||
        product.category ||
        product.productType ||
        ""
      );

    for(
      const category
      of CATEGORIES
    ){

      if(
        explicit ===
        normalizeText(
          category.id
        ) ||
        explicit ===
        normalizeText(
          category.name
        )
      ){
        return category.id;
      }
    }

    const text =
      normalizeText(
        [
          product.name,
          product.description,
          product.productType,
          product.type,
          product.category,
          product.collectionName,
          product.tags,
          product.ribbon
        ]
          .flat()
          .filter(Boolean)
          .join(
            " "
          )
      );

    for(
      const category
      of CATEGORIES
    ){

      if(
        category.terms.some(
          term =>
            text.includes(
              normalizeText(
                term
              )
            )
        )
      ){
        return category.id;
      }
    }

    return "late";
  }

  function normalizeMedia(
    product
  ){

    if(
      Array.isArray(
        product.media
      )
    ){

      return product.media
        .map(
          media =>
            typeof media ===
            "string"
              ?media
              :media.url ||
               media.src ||
               media.imageUrl ||
               media.image?.url ||
               ""
        )
        .filter(Boolean);
    }

    return [
      product.image ||
      product.imageUrl ||
      ""
    ].filter(Boolean);
  }

  function normalizeProduct(
    product
  ){

    const category =
      inferCategory(
        product
      );

    const media =
      normalizeMedia(
        product
      );

    return {

      id:
        product.id ||
        product._id ||
        createId(),

      name:
        product.name ||
        "CajaModa Product",

      price:
        Number(
          product.price?.amount ??
          product.price ??
          product.priceData?.price ??
          0
        ),

      category,

      media,

      image:
        media[0] ||
        "",

      description:
        product.description ||
        "",

      productType:
        product.productType ||
        product.type ||
        "",

      raw:
        product

    };
  }

  function productSearchText(
    product
  ){

    const category =
      categoryById(
        product.category
      );

    return normalizeText(
      [
        product.name,
        product.description,
        product.productType,
        category.name,
        category.terms
      ]
        .flat()
        .join(
          " "
        )
    );
  }

  function matchesSearch(
    product
  ){

    const query =
      normalizeText(
        state.search
      );

    if(
      !query
    ){
      return true;
    }

    const tokens =
      query
        .split(
          " "
        )
        .filter(Boolean);

    const text =
      productSearchText(
        product
      );

    return tokens.every(
      token =>
        text.includes(
          token
        )
    );
  }

  function renderHomeSections(){

      0;

    $("homeSections").innerHTML =

        category => {

          const products =
            productsForCategory(
              category.id

          if(
            searching &&
            products.length ===
            0
          ){
            return "";
          }

          renderedSections +=
            1;

          const cards = [
            ...products.map(
              productMarkup
            )
          ];

          if(
            !searching
          ){

            for(
              let slot =
                products.length +
                1;
              slot <=
                CONFIG.maxSlotsPerCategory;
              slot +=
                1
            ){

              cards.push(
                placeholderMarkup(
                  category.id,
                  slot

          }

          return `
            <section
              class="productSection"
              data-category-section="${category.id}"

  function bindRails(){

    qsa(
      "[data-product-rail]"
    ).forEach(
      rail => {

        rail.addEventListener(
          "scroll",
          () => {

            const section =
              rail.closest(
                ".productSection"
              );

            const dots =
              qsa(
                ".railDot",
                section
              );

            const max =
              rail.scrollWidth -
              rail.clientWidth;

            const ratio =
              max >
              0
                ?rail.scrollLeft /
                 max
                :0;

            const active =
              Math.min(
                dots.length -
                1,
                Math.round(
                  ratio *
                  (
                    dots.length -
                    1
                  )
                )
              );

            dots.forEach(
              (
                dot,
                index
              ) => {

                dot.classList.toggle(
                  "active",
                  index ===
                  active
                );

              }
            );

          },
          {
            passive:
              true
          }
        );

      }
    );
  }

  /* =========================================================

     ========================================================= */

  window.addEventListener(
    "message",
    event => {

      const message =
        event.data ||
        {};

      if(
        ![
          "CAJAMODA_STOREFRONT",
          "CAJAMODA_IFRAME",
          "CAJAMODA_WIX"
        ].includes(
          message.source
        )
      ){
        return;
      }

      const payload =
        message.payload ??
        message.data ??
        {};

      switch(
        message.type
      ){

        case "INIT":

          if(
            Array.isArray(
              payload.products
            )
          ){

            state.products =
              payload.products.map(
                normalizeProduct
              );

            renderHomeSections();
            renderFavorites();

          }

          if(
            payload.cart
          ){

            saveJson(
              "cajamoda-cart",
              payload.cart
            );

            syncBagCount();

          }

          break;

        case "CATALOG_PATCH":

          if(
            Array.isArray(
              payload.products
            )
          ){

            const map =
              new Map(
                state.products.map(
                  product => [
                    String(
                      product.id
                    ),
                    product
                  ]
                )
              );

            payload.products
              .map(
                normalizeProduct
              )
              .forEach(
                product => {

                  map.set(
                    String(
                      product.id
                    ),
                    product
                  );

                }
              );

            state.products = [
              ...map.values()
            ];

            renderHomeSections();
            renderFavorites();

          }

          break;

        case "CART_STATE":

          saveJson(
            "cajamoda-cart",
            payload.cart ||
            payload
          );

          syncBagCount();

          break;

        case "CART_COUNT":

          {
            const current =
              readJson(
                "cajamoda-cart",
                {}
              );

            current.count =
              Number(
                payload.count ??
                payload ??
                0
              );

            saveJson(
              "cajamoda-cart",
              current
            );

            syncBagCount();
          }

          break;

        default:
          break;
      }

    }
  );

            }
          );

        };
    }
  );

  $("navFavorites")
    .onclick =
      () => {

        renderFavorites();

        openOverlay(
          $("favoritesOverlay")
        );

      };

  $("favoritesClose")
    .onclick =
      () =>
        closeOverlay(
          $("favoritesOverlay")
        );

  $("favoritesOverlay")
    .onclick =
      event => {

        if(
          event.target ===
          $("favoritesOverlay")
        ){

          closeOverlay(
            $("favoritesOverlay")
          );
        }

      };

  $("navProfile")
    .onclick =
      () => {

        loadProfile();

        openOverlay(
          $("profileOverlay")
        );

      };

  $("profileClose")
    .onclick =
      () =>
        closeOverlay(
          $("profileOverlay")
        );

  $("profileOverlay")
    .onclick =
      event => {

        if(
          event.target ===
          $("profileOverlay")
        ){

          closeOverlay(
            $("profileOverlay")
          );
        }

      };

  $("profileLogin")
    .onclick =
      () =>
        submitProfile(
          "login"
        );

  $("profileCreate")
    .onclick =
      () =>
        submitProfile(
          "signup"
        );

  $("navHome")
    .onclick =
      () =>
        window.scrollTo({
          top:
            0,

          behavior:
            "smooth"
        });

  $("navBag")
    .onclick =
      openCheckout;

  $("homeBagTop")
    .onclick =
      openCheckout;

  window.addEventListener(
    "storage",
    event => {

      if(
        event.key ===
        "cajamoda-cart"
      ){

        syncBagCount();
      }

      if(
        event.key ===
        "cajamoda-favorites"
      ){

        state.favorites =
          new Set(
            readFavorites()
          );

        renderHomeSections();
        renderFavorites();
      }

    }
  );

  window.addEventListener(
    "pageshow",
    () => {

      syncBagCount();

      state.favorites =
        new Set(
          readFavorites()
        );

      renderHomeSections();
    }
  );

  /* =========================================================
     START
     ========================================================= */

  renderAll();

  sendBridge(
    "READY",
    {
      brand:
        "CAJAMODA",

      page:
        "HOME",

      version:
        "CAJAMODA_HOME_FREEZE_V1",

      capabilities:[

        "CAJAMODA_COLOMBIA_HEADER",

        "CM_LOGO",

        "FOUR_CATEGORY_ANCHORS",

        "ANCHOR_SCROLLING",

        "LONG_NIGHTS",

        "QUIET_DAYS",

        "QUICK_AND_EASY",

        "SUNBATHING",

        "TEN_SLOTS_PER_CATEGORY",

        "PLACEHOLDER_SLOTS",

        "THREE_PRODUCTS_VISIBLE",

        "HORIZONTAL_PRODUCT_RAILS",

        "LIVE_WIX_PRODUCTS",

        "FUNCTIONAL_SEARCH",

        "PRODUCT_ROUTE",

        "CHECKOUT_ROUTE",

        "LOCAL_FAVORITES",

        "MEMBER_PROFILE",

        "HOME_NAVIGATION",

        "STORE_OWNER_PORTAL",

        "CAJAMODA_ONLY_BRANDING"
      ]
    }
  );

})();
</script>

  type="module"
  src="/src/main.js"
></script>
