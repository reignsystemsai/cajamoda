<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">

<title>Producto | CajaModa Colombia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

/* ============================================================
   CAJAMODA PRODUCT PAGE
   FULL SCREEN PRODUCT FREEZE
   ============================================================ */

:root{

  --bg:#ffffff;

  --ink:#080808;

  --soft:#555555;

  --muted:#8b8b8b;

  --line:
    rgba(0,0,0,.10);

  --line-strong:
    rgba(0,0,0,.18);

  --glass:
    rgba(255,255,255,.48);

  --glass-strong:
    rgba(255,255,255,.72);

  --nav-h:
    52px;

  --mobile-max:
    430px;

  --safe-top:
    env(
      safe-area-inset-top,
      0px
    );

  --safe-bottom:
    env(
      safe-area-inset-bottom,
      0px
    );
}

/* ============================================================
   RESET
   ============================================================ */

*{
  box-sizing:border-box;
}

html{

  width:100%;

  min-height:100%;

  margin:0;

  background:#fff;

  -webkit-text-size-adjust:100%;
}

body{

  width:100%;

  min-height:100%;

  margin:0;

  overflow-x:hidden;

  background:#fff;

  color:var(--ink);

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  -webkit-font-smoothing:
    antialiased;
}

body.locked{
  overflow:hidden;
}

button,
input,
textarea{

  font:inherit;

  color:inherit;
}

button{

  border:0;

  padding:0;

  margin:0;

  background:none;

  cursor:pointer;

  -webkit-tap-highlight-color:
    transparent;
}

img{

  display:block;

  max-width:100%;

  user-select:none;

  -webkit-user-drag:none;
}

svg{

  display:block;

  pointer-events:none;
}

.hidden{
  display:none!important;
}

/* ============================================================
   APP
   ============================================================ */

.productApp{

  position:relative;

  width:100%;

  min-height:100dvh;

  margin:0 auto;

  background:#fff;

  overflow:hidden;
}

@media(min-width:700px){

  body{
    background:#f3f3f3;
  }

  .productApp{

    width:
      min(
        100%,
        var(--mobile-max)
      );

    box-shadow:
      0 0 65px
      rgba(0,0,0,.08);
  }
}

/* ============================================================
   FULL SCREEN PHOTO
   ============================================================ */

.photoStage{

  position:relative;

  width:100%;

  height:100dvh;

  min-height:650px;

  overflow:hidden;

  background:#fff;

  touch-action:pan-y;
}

/*
  The product photo now owns the entire screen.
  No logo area.
  No white header.
  No top-left button.
*/

.mainPhoto{

  position:absolute;

  inset:0;

  width:100%;

  height:100%;

  object-fit:cover;

  object-position:center center;

  background:#fff;

  transition:
    opacity .18s ease,
    transform .22s ease;
}

.mainPhoto.changing{

  opacity:.80;

  transform:
    scale(.985);
}

/* ============================================================
   THUMBNAILS
   4 ADDITIONAL PHOTOS
   ============================================================ */

.thumbnailRail{

  position:absolute;

  z-index:10;

  top:
    calc(
      72px +
      var(--safe-top)
    );

  right:13px;

  width:47px;

  display:flex;

  flex-direction:column;

  gap:7px;
}

.thumbnail{

  position:relative;

  width:47px;

  height:59px;

  padding:2px;

  border-radius:9px;

  overflow:hidden;

  background:
    rgba(255,255,255,.72);

  border:
    1px solid
    rgba(0,0,0,.10);

  box-shadow:
    0 6px 17px
    rgba(0,0,0,.07);

  backdrop-filter:
    blur(12px);

  -webkit-backdrop-filter:
    blur(12px);

  transition:
    transform .17s ease,
    border-color .17s ease;
}

.thumbnail img{

  width:100%;

  height:100%;

  object-fit:cover;

  border-radius:7px;
}

.thumbnail.active{

  border-color:#111;

  box-shadow:
    0 0 0 1px
    rgba(0,0,0,.30),
    0 6px 17px
    rgba(0,0,0,.07);
}

.thumbnailPlaceholder{

  width:100%;

  height:100%;

  border-radius:7px;

  display:grid;

  place-items:center;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.92),
      rgba(240,240,240,.85)
    );

  color:#999;

  font-size:6px;
}

@media(hover:hover){

  .thumbnail:hover{

    transform:
      translateX(-3px)
      scale(1.025);
  }
}

/* ============================================================
   TOP BAG
   ============================================================ */

.topBag{

  position:absolute;

  z-index:14;

  top:
    calc(
      15px +
      var(--safe-top)
    );

  right:13px;
}

/* ============================================================
   GLASS CIRCLE
   ============================================================ */

.circleControl{

  position:relative;

  width:42px;

  height:42px;

  border-radius:50%;

  display:grid;

  place-items:center;

  background:
    rgba(255,255,255,.70);

  border:
    1px solid
    rgba(255,255,255,.96);

  box-shadow:

    0 0 0 1px
    rgba(0,0,0,.025),

    0 8px 22px
    rgba(0,0,0,.08);

  backdrop-filter:
    blur(20px)
    saturate(155%);

  -webkit-backdrop-filter:
    blur(20px)
    saturate(155%);

  transition:
    transform .17s ease,
    box-shadow .17s ease;
}

.circleControl svg{

  width:20px;

  height:20px;

  stroke-width:1.5;
}

.circleControl:active{

  transform:
    scale(.91);
}

@media(hover:hover){

  .circleControl:hover{

    transform:
      translateY(-2px)
      scale(1.035);

    box-shadow:
      0 13px 28px
      rgba(0,0,0,.12);
  }
}

/* ============================================================
   BAG COUNT
   ============================================================ */

.bagBadge{

  position:absolute;

  top:-4px;

  right:-4px;

  min-width:18px;

  height:18px;

  padding:
    0 4px;

  border-radius:999px;

  background:#080808;

  color:#fff;

  border:
    2px solid #fff;

  display:grid;

  place-items:center;

  font-size:7px;

  font-weight:800;
}

.bagBadge.bump{

  animation:
    bagBump .24s ease;
}

@keyframes bagBump{

  50%{
    transform:
      scale(1.30);
  }
}

/* ============================================================
   RIGHT CONTROLS
   THUMBNAILS AND NUMBER NO LONGER OVERLAP
   ============================================================ */

.rightControls{

  position:absolute;

  z-index:13;

  /*
    Four thumbnails occupy:
    4 x 59 = 236px
    + three 7px gaps = 21px

    Starting around 72px means the controls safely begin
    after the thumbnail stack.
  */

  top:
    calc(
      351px +
      var(--safe-top)
    );

  right:15px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:9px;
}

/* ============================================================
   PRODUCT NUMBER
   ============================================================ */

.productNumber{

  width:38px;

  height:38px;

  border-radius:50%;

  display:grid;

  place-items:center;

  background:
    rgba(255,255,255,.72);

  border:
    1px solid
    rgba(255,255,255,.96);

  box-shadow:

    0 0 0 1px
    rgba(0,0,0,.025),

    0 7px 18px
    rgba(0,0,0,.07);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  font-size:11px;

  font-weight:700;
}

/* ============================================================
   FAVORITE
   ============================================================ */

.favoriteButton{

  color:#111;
}

.favoriteButton.active{

  color:#e61937;

  background:
    rgba(255,235,239,.84);

  box-shadow:

    0 0 0 1px
    rgba(230,25,55,.08),

    0 9px 24px
    rgba(230,25,55,.16);
}

.favoriteButton.active svg{

  fill:currentColor;

  stroke:currentColor;
}

/* ============================================================
   SHARE - PAPER PLANE
   ============================================================ */

.shareButton svg{

  width:21px;

  height:21px;

  stroke-width:1.45;
}

/* ============================================================
   CLOSED PRICE CAPSULE
   ============================================================ */

.priceCapsule{

  position:absolute;

  z-index:16;

  left:19px;

  bottom:
    calc(
      var(--nav-h) +
      39px +
      var(--safe-bottom)
    );

  min-width:172px;

  height:49px;

  padding:
    0 15px
    0 17px;

  border-radius:999px;

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:14px;

  background:
    rgba(255,255,255,.53);

  border:
    1px solid
    rgba(255,255,255,.94);

  box-shadow:

    0 0 0 1px
    rgba(0,0,0,.035),

    0 9px 28px
    rgba(0,0,0,.09);

  backdrop-filter:
    blur(22px)
    saturate(155%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(155%);

  transition:
    transform .17s ease,
    background .17s ease;
}

.priceCapsuleText{

  font-size:13px;

  font-weight:500;

  white-space:nowrap;
}

.priceCapsule svg{

  width:17px;

  height:17px;

  stroke-width:1.9;
}

.priceCapsule:active{

  transform:
    scale(.97);
}

@media(hover:hover){

  .priceCapsule:hover{

    transform:
      translateY(-2px);

    background:
      rgba(255,255,255,.69);
  }
}

/* ============================================================
   BOTTOM NAV
   ============================================================ */

.bottomNav{

  position:fixed;

  z-index:90;

  left:50%;

  bottom:
    max(
      7px,
      var(--safe-bottom)
    );

  transform:
    translateX(-50%);

  width:
    min(
      calc(100% - 25px),
      402px
    );

  height:
    var(--nav-h);

  padding:
    2px 5px;

  border-radius:18px;

  display:grid;

  grid-template-columns:
    repeat(
      5,
      1fr
    );

  align-items:center;

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.66),
      rgba(255,255,255,.27)
    );

  border:
    1px solid
    rgba(255,255,255,.94);

  box-shadow:

    0 0 0 1px
    rgba(0,0,0,.028),

    inset 0 1px 0
    rgba(255,255,255,.98),

    0 8px 25px
    rgba(0,0,0,.075);

  backdrop-filter:
    blur(29px)
    saturate(170%);

  -webkit-backdrop-filter:
    blur(29px)
    saturate(170%);
}

.navButton{

  position:relative;

  height:43px;

  border-radius:14px;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:1px;

  transition:
    transform .17s ease,
    background .17s ease;
}

.navButton svg{

  width:18px;

  height:18px;

  stroke-width:1.4;
}

.navButton span{

  font-size:6.7px;
}

/*
  No permanent selector.
*/

.navButton.active{

  background:transparent;

  box-shadow:none;
}

@media(hover:hover){

  .navButton:hover{

    transform:
      translateY(-2px);

    background:
      rgba(255,255,255,.65);
  }
}

.navButton:active{

  transform:
    scale(.94);

  background:
    rgba(255,255,255,.72);
}

.navPlusOrb{

  width:29px;

  height:29px;

  border-radius:50%;

  display:grid;

  place-items:center;

  background:#111;

  color:#fff;

  box-shadow:
    0 6px 16px
    rgba(0,0,0,.15);
}

.navPlusOrb svg{

  width:15px;

  height:15px;
}

.navBagBadge{

  position:absolute;

  top:0;

  right:
    calc(
      50% - 18px
    );

  min-width:15px;

  height:15px;

  padding:
    0 3px;

  border-radius:999px;

  background:#090909;

  color:#fff;

  border:
    1.5px solid #fff;

  display:grid;

  place-items:center;

  font-size:
    6.3px!important;

  font-weight:800;
}

/* ============================================================
   DETAILS OVERLAY
   ============================================================ */

.detailsOverlay{

  position:fixed;

  inset:0;

  z-index:120;

  display:none;

  pointer-events:none;
}

.detailsOverlay.open{

  display:block;

  pointer-events:auto;
}

/*
  We do not blur the product image itself.
  The glass sheet performs the background blur.
*/

.detailsBackdrop{

  position:absolute;

  inset:0;

  background:
    rgba(255,255,255,.01);
}

/* ============================================================
   CLEAR GLASS DETAIL SHEET
   ============================================================ */

.detailsSheet{

  position:absolute;

  left:17px;

  right:17px;

  bottom:
    calc(
      var(--nav-h) +
      18px +
      var(--safe-bottom)
    );

  max-height:
    min(
      64dvh,
      555px
    );

  border-radius:24px;

  overflow:hidden;

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.69),
      rgba(255,255,255,.39)
    );

  border:
    1px solid
    rgba(255,255,255,.95);

  box-shadow:

    0 0 0 1px
    rgba(0,0,0,.04),

    0 22px 60px
    rgba(0,0,0,.15);

  backdrop-filter:
    blur(34px)
    saturate(155%);

  -webkit-backdrop-filter:
    blur(34px)
    saturate(155%);

  transform:
    translateY(24px);

  opacity:0;

  transition:
    transform .24s ease,
    opacity .24s ease;
}

.detailsOverlay.open
.detailsSheet{

  transform:none;

  opacity:1;
}

.detailsScroll{

  max-height:
    min(
      64dvh,
      555px
    );

  overflow-y:auto;

  padding:
    11px 14px
    15px;

  -webkit-overflow-scrolling:
    touch;
}

/* ============================================================
   DRAG HANDLE
   ============================================================ */

.dragHandle{

  width:32px;

  height:3px;

  margin:
    0 auto 10px;

  border-radius:999px;

  background:
    rgba(0,0,0,.20);
}

/* ============================================================
   MINIMAL TOP
   BAG + PRICE
   ============================================================ */

.detailsTop{

  display:grid;

  grid-template-columns:
    1fr auto;

  gap:12px;

  align-items:start;
}

.detailsTitle{

  font-size:15px;

  line-height:1.2;

  font-weight:600;
}

.detailsPrice{

  margin-top:4px;

  font-size:19px;

  line-height:1;

  font-weight:800;
}

.detailsPrice small{

  font-size:8px;

  font-weight:600;
}

.detailsBag{

  position:relative;

  width:39px;

  height:39px;

  border-radius:50%;

  display:grid;

  place-items:center;

  background:
    rgba(255,255,255,.55);

  border:
    1px solid
    rgba(0,0,0,.07);

  box-shadow:
    0 5px 15px
    rgba(0,0,0,.055);
}

.detailsBag svg{

  width:19px;

  height:19px;

  stroke-width:1.5;
}

.detailsBagCount{

  position:absolute;

  top:-3px;

  right:-3px;

  min-width:16px;

  height:16px;

  padding:
    0 3px;

  border-radius:999px;

  display:grid;

  place-items:center;

  background:#111;

  color:#fff;

  border:
    1.5px solid #fff;

  font-size:6px;

  font-weight:800;
}

/* ============================================================
   DESCRIPTION
   NOW ABOVE COLOR + SIZE
   ============================================================ */

.descriptionBlock{

  margin-top:15px;

  padding-top:12px;

  border-top:
    1px solid
    rgba(0,0,0,.07);
}

.sectionTitle{

  font-size:8.5px;

  font-weight:800;
}

.descriptionText{

  margin-top:6px;

  font-size:8px;

  line-height:1.55;

  color:#444;
}

/* ============================================================
   OPTIONS
   ============================================================ */

.optionSection{

  margin-top:15px;
}

.optionLabel{

  font-size:8.5px;

  font-weight:700;
}

.optionLabelValue{

  font-weight:800;
}

/* ============================================================
   COLOR
   ============================================================ */

.colorRow{

  display:flex;

  align-items:center;

  gap:10px;

  margin-top:8px;
}

.colorButton{

  width:29px;

  height:29px;

  border-radius:50%;

  border:
    3px solid
    rgba(255,255,255,.88);

  box-shadow:
    0 0 0 1px
    rgba(0,0,0,.10);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.colorButton.active{

  box-shadow:

    0 0 0 2px
    #111,

    0 0 0 4px
    rgba(255,255,255,.94);
}

.colorButton:active{

  transform:
    scale(.91);
}

.colorBlack{
  background:#090909;
}

.colorRed{
  background:#e92336;
}

.colorCream{
  background:#f2dfc7;
}

/* ============================================================
   SIZES
   ============================================================ */

.sizeGrid{

  display:grid;

  grid-template-columns:
    repeat(
      5,
      1fr
    );

  gap:7px;

  margin-top:8px;
}

.sizeButton{

  position:relative;

  height:39px;

  border-radius:10px;

  border:
    1px solid
    rgba(0,0,0,.10);

  background:
    rgba(255,255,255,.43);

  font-size:8.5px;

  font-weight:600;

  transition:
    background .15s ease,
    border-color .15s ease,
    transform .15s ease;
}

.sizeButton.selected{

  border-color:#080808;

  background:
    rgba(255,255,255,.82);

  box-shadow:
    inset 0 0 0 1px
    rgba(0,0,0,.28);
}

.sizeButton:active{

  transform:
    scale(.94);
}

/* ============================================================
   PURCHASE ACTIONS
   ============================================================ */

.purchaseActions{

  margin-top:17px;
}

.addBagButton,
.buyNowButton{

  width:100%;

  height:43px;

  border-radius:11px;

  font-size:9px;

  font-weight:750;
}

.addBagButton{

  background:#080808;

  color:#fff;
}

.buyNowButton{

  margin-top:6px;

  background:
    rgba(255,255,255,.42);

  border:
    1px solid #111;
}

.purchaseMeta{

  display:flex;

  align-items:center;

  justify-content:
    space-between;

  gap:10px;

  margin-top:9px;

  font-size:5.9px;

  color:#555;
}

/* ============================================================
   REVIEWS
   ============================================================ */

/*
  Reviews are intentionally NOT rendered yet.

  We will add them only when they are connected to
  real shared storage/authentication so customers
  can genuinely publish and read reviews.
*/

/* ============================================================
   SOCIAL SHARE
   ============================================================ */

.shareOverlay{

  position:fixed;

  inset:0;

  z-index:190;

  display:none;

  background:
    rgba(0,0,0,.08);

  backdrop-filter:
    blur(5px);

  -webkit-backdrop-filter:
    blur(5px);
}

.shareOverlay.open{
  display:block;
}

.sharePanel{

  position:absolute;

  left:12px;

  right:12px;

  bottom:
    calc(
      var(--nav-h) +
      18px +
      var(--safe-bottom)
    );

  border-radius:20px;

  padding:13px;

  background:
    rgba(255,255,255,.77);

  border:
    1px solid
    rgba(255,255,255,.96);

  box-shadow:
    0 18px 50px
    rgba(0,0,0,.13);

  backdrop-filter:
    blur(28px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(28px)
    saturate(160%);
}

.shareHead{

  display:flex;

  justify-content:
    space-between;

  align-items:center;
}

.shareTitle{

  font-size:11px;

  font-weight:800;
}

.shareClose{

  width:29px;

  height:29px;

  border-radius:50%;

  display:grid;

  place-items:center;

  border:
    1px solid
    rgba(0,0,0,.07);

  background:
    rgba(255,255,255,.55);
}

.shareClose svg{

  width:14px;

  height:14px;
}

.shareOptions{

  display:grid;

  grid-template-columns:
    repeat(
      3,
      1fr
    );

  gap:8px;

  margin-top:12px;
}

.socialShare{

  min-height:73px;

  border-radius:14px;

  border:
    1px solid
    rgba(0,0,0,.07);

  background:
    rgba(255,255,255,.44);

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  gap:7px;

  transition:
    transform .17s ease,
    background .17s ease;
}

.socialShare:active{

  transform:
    scale(.95);
}

.socialIcon{

  width:31px;

  height:31px;

  border-radius:50%;

  display:grid;

  place-items:center;

  background:#111;

  color:#fff;

  font-size:8px;

  font-weight:800;
}

.socialLabel{

  font-size:7.2px;

  font-weight:700;
}

/* ============================================================
   PLUS MENU
   ============================================================ */

.plusOverlay{

  position:fixed;

  inset:0;

  z-index:180;

  display:none;

  background:
    rgba(0,0,0,.08);

  backdrop-filter:
    blur(5px);

  -webkit-backdrop-filter:
    blur(5px);
}

.plusOverlay.open{
  display:block;
}

.plusPanel{

  position:absolute;

  left:12px;

  right:12px;

  bottom:
    calc(
      var(--nav-h) +
      18px +

<script>

(() => {

  "use strict";

  /* ============================================================
     CONFIG
     ============================================================ */

  const CONFIG = {

    homePage:
      "/",

    checkoutPage:
      "/checkout/",

    bridgeSource:
      "CAJAMODA_IFRAME",

    acceptedSources:[
      "CAJAMODA_STOREFRONT",
      "CAJAMODA_IFRAME",
      "CAJAMODA_WIX",
      "MODAPOP_IFRAME",
      "MODAPOP_WIX"
    ],

    sizes:[
      "XS",
      "S",
      "M",
      "L",
      "XL"
    ],

    maxProductNumber:
      100
  };

  /* ============================================================
     DOM
     ============================================================ */

  const $ =
    id =>
      document.getElementById(
        id
      );

  const qsa =
    (
      selector,
      root=document
    ) =>
      [
        ...root.querySelectorAll(
          selector
        )
      ];

  /* ============================================================
     STATE
     ============================================================ */

  const savedFavorites =
    readJson(
      "cajamoda-favorites",
      []
    );

  const state = {

    catalog:[],

    product:null,

    categoryId:null,

    categoryProducts:[],

    productIndex:0,

    imageIndex:0,

    selectedSize:null,

    selectedColor:
      "Negro",

    favorites:
      new Set(
        Array.isArray(
          savedFavorites
        )
          ?savedFavorites
            .map(String)
          :[]
      )
  };

  /* ============================================================
     STORAGE
     ============================================================ */

  function readJson(
    key,
    fallback
  ){

    try{

      const raw =
        localStorage.getItem(
          key
        );

      if(
        !raw
      ){
        return fallback;
      }

      return JSON.parse(
        raw
      );

    }catch{

      return fallback;
    }
  }

  function saveJson(
    key,
    value
  ){

    try{

      localStorage.setItem(
        key,
        JSON.stringify(
          value
        )
      );

    }catch{}
  }

  /* ============================================================
     HELPERS
     ============================================================ */

  function escapeHtml(
    value
  ){

    return String(
      value ??
      ""
    )
      .replaceAll(
        "&",
        "&amp;"
      )
      .replaceAll(
        "<",
        "&lt;"
      )
      .replaceAll(
        ">",
        "&gt;"
      )
      .replaceAll(
        '"',
        "&quot;"
      )
      .replaceAll(
        "'",
        "&#039;"
      );
  }

  function money(
    value
  ){

    return new Intl.NumberFormat(
      "es-CO",
      {
        style:
          "currency",

        currency:
          "COP",

        maximumFractionDigits:
          0
      }
    )
      .format(
        Number(
          value ||
          0
        )
      );
  }

  function safeText(
    value,
    fallback=""
  ){

    return String(
      value ||
      fallback
    );
  }

  function createId(){

    if(
      crypto?.randomUUID
    ){
      return crypto.randomUUID();
    }

    return (
      `${Date.now()}-` +
      Math.random()
        .toString(16)
        .slice(2)
    );
  }

  function showToast(
    text
  ){

    const toast =
      $("toast");

    toast.textContent =
      text;

    toast.classList.add(
      "show"
    );

    clearTimeout(
      showToast.timer
    );

    showToast.timer =
      setTimeout(
        () => {

          toast.classList
            .remove(
              "show"
            );

        },
        1550
      );
  }

  /* ============================================================
     BRIDGE
     ============================================================ */

  function sendBridge(
    type,
    payload={}
  ){

    try{

      window.parent.postMessage(
        {
          source:
            CONFIG.bridgeSource,

          type,

          payload
        },
        "*"
      );

    }catch{}
  }

  function track(
    eventType,
    payload={}
  ){

    sendBridge(
      "TRACK_EVENT",
      {

        eventId:
          createId(),

        eventType,

        occurredAt:
          new Date()
            .toISOString(),

        page:
          "product",

        brand:
          "CAJAMODA",

        productId:
          state.product?.id ||
          null,

        ...payload
      }
    );
  }

  /* ============================================================
     PRODUCT MEDIA
     ============================================================ */

  function getMedia(
    product
  ){

    if(
      Array.isArray(
        product?.media
      )
    ){

      return product.media
        .map(
          item => {

            if(
              typeof item ===
              "string"
            ){
              return item;
            }

            return (
              item.url ||
              item.src ||
              item.imageUrl ||
              item.image?.url ||
              ""
            );

          }
        )
        .filter(Boolean);
    }

    return [
      product?.image ||
      product?.imageUrl ||
      ""
    ]
      .filter(Boolean);
  }

  /* ============================================================
     PRODUCT LOAD
     ============================================================ */

  function loadInitialProduct(){

    const params =
      new URLSearchParams(
        location.search
      );

    const productId =
      params.get(
        "productId"
      );

    state.categoryId =
      params.get(
        "category"
      );

    state.catalog =
      readJson(
        "cajamoda-catalog",
        []
      );

    if(
      !Array.isArray(
        state.catalog
      )
    ){
      state.catalog =
        [];
    }

    const cachedActive =
      readJson(
        "cajamoda-active-product",
        null
      );

    state.product =
      state.catalog.find(
        product =>
          String(
            product.id
          ) ===
          String(
            productId
          )
      ) ||
      cachedActive ||
      state.catalog[0] ||
      null;

    if(
      !state.product
    ){

      renderEmptyProduct();

      return;
    }

    state.categoryId =
      state.product.category ||
      state.categoryId ||
      null;

    state.categoryProducts =
      state.catalog.filter(
        product =>
          !state.categoryId ||
          product.category ===
          state.categoryId
      );

    if(
      !state.categoryProducts.length
    ){

      state.categoryProducts =
        [
          state.product
        ];
    }

    const foundIndex =
      state.categoryProducts
        .findIndex(
          product =>
            String(
              product.id
            ) ===
            String(
              state.product.id
            )
        );

    state.productIndex =
      foundIndex >= 0
        ?foundIndex
        :0;

    renderProduct();

  }

  function renderEmptyProduct(){

    $("mainPhoto")
      .removeAttribute(
        "src"
      );

    $("priceCapsuleText")
      .textContent =
        "Producto no disponible";

    $("detailsTitle")
      .textContent =
        "Producto no disponible";

    $("detailsPrice")
      .innerHTML =
        "$0 <small>COP</small>";
  }

  /* ============================================================
     RENDER PRODUCT
     ============================================================ */

  function renderProduct(){

    const product =
      state.product;

    if(
      !product
    ){
      return;
    }

    const media =
      getMedia(
        product
      );

    state.imageIndex =
      Math.min(
        state.imageIndex,
        Math.max(
          0,
          media.length -
          1
        )
      );

    const currentImage =
      media[
        state.imageIndex
      ] ||
      product.image ||
      "";

    $("mainPhoto").src =
      currentImage;

    $("mainPhoto").alt =
      safeText(
        product.name,
        "Producto CajaModa"
      );

    $("priceCapsuleText")
      .textContent =
        `${money(product.price)} COP`;

    $("detailsTitle")
      .textContent =
        safeText(
          product.name,
          "Producto CajaModa"
        );

    $("detailsPrice")
      .innerHTML =
        `${money(product.price)} <small>COP</small>`;

    $("descriptionText")
      .textContent =
        safeText(
          product.description,
          "Producto seleccionado de CajaModa. Elige tu color y tu talla para agregarlo a tu bolsa."
        );

    const productNumber =
      Math.min(
        CONFIG.maxProductNumber,
        state.productIndex +
        1
      );

    $("productNumber")
      .textContent =
        String(
          productNumber
        );

    state.selectedSize =
      findExistingSelectedSize(
        product.id
      );

    $("selectedSizeLabel")
      .textContent =
        state.selectedSize ||
        "Selecciona";

    renderSizeState();

    renderThumbnails();

    syncFavoriteUI();

    syncBagCount();

    saveJson(
      "cajamoda-active-product",
      product
    );

    updateUrlWithoutReload();

  }

  function updateUrlWithoutReload(){

    if(
      !state.product
    ){
      return;
    }

    const url =
      new URL(
        location.href
      );

    url.searchParams.set(
      "productId",
      state.product.id
    );

    if(
      state.product.category
    ){

      url.searchParams.set(
        "category",
        state.product.category
      );
    }

    history.replaceState(
      null,
      "",
      url
    );
  }

  /* ============================================================
     THUMBNAILS
     ============================================================ */

  function renderThumbnails(){

    const media =
      getMedia(
        state.product
      );

    const five =
      media
        .slice(
          0,
          5
        );

    while(
      five.length <
      5
    ){

      five.push(
        ""
      );
    }

    /*
      Main photo = position zero.
      Four additional thumbnails = positions 1–4.
    */

    $("thumbnailRail")
      .innerHTML =
        five

     ============================================================ */

  let touchStartX =
    0;

  let touchStartY =
    0;

  $("photoStage")
    .addEventListener(
      "touchstart",
      event => {

        const touch =
          event.changedTouches[0];

        touchStartX =
          touch.clientX;

        touchStartY =
          touch.clientY;

      },
      {
        passive:true
      }
    );

  $("photoStage")
    .addEventListener(
      "touchend",
      event => {

        if(
          $("detailsOverlay")
            .classList
            .contains(
              "open"
            )
        ){
          return;
        }

        const touch =
          event.changedTouches[0];

        const dx =
          touch.clientX -
          touchStartX;

        const dy =
          touch.clientY -
          touchStartY;

        if(
          Math.abs(
            dx
          ) <
          55
        ){
          return;
        }

        if(
          Math.abs(
            dx
          ) <=
          Math.abs(
            dy
          )
        ){
          return;
        }

        if(
          dx <
          0
        ){

          nextProduct();

        }else{

          previousProduct();
        }

      },
      {
        passive:true
      }
    );

  function nextProduct(){

    if(
      !state.categoryProducts.length
    ){
      return;

    state.productIndex =
      (
        state.productIndex +
        1

      state.categoryProducts.length;

    state.product =
      state.categoryProducts[
        state.productIndex
      ];

    state.imageIndex =
      0;

    state.selectedSize =
      null;

    renderProduct();

    track(
      "PRODUCT_SWIPE",

        direction:
          "next"

    );
  }

  function previousProduct(){

    ){

    state.productIndex =

        state.productIndex -
        1 +
        state.categoryProducts.length

  /* ============================================================

  function readCart(){

    const stored =
      readJson(
        "cajamoda-cart",
        {
          items:[],
          count:0,
          total:0
        }
      );

    return normalizeCart(
      stored
    );
  }

  function normalizeCart(
    cart
  ){

    const items =
      Array.isArray(
        cart?.items
      )
        ?cart.items
        :Array.isArray(
          cart?.lineItems
        )
          ?cart.lineItems
          :[];

    const normalizedItems =
      items.map(
        item => ({

          id:
            item.id ||
            item._id ||
            item.lineItemId ||
            createId(),

          productId:
            item.productId ||
            item.catalogReference
              ?.catalogItemId ||
            null,

          variantId:
            item.variantId ||
            item.catalogReference
              ?.variantId ||
            null,

          name:
            item.name ||
            item.productName ||
            "Producto",

          image:
            item.image ||
            item.imageUrl ||
            item.media?.url ||
            "",

          size:
            item.size ||
            item.options?.Size ||
            item.options?.size ||
            "",

          color:
            item.color ||
            item.options?.Color ||
            item.options?.color ||
            "Negro",

          quantity:
            Math.max(
              1,
              Number(
                item.quantity ||
                1
              )
            ),

          price:
            Number(
              item.price?.amount ??
              item.price ??
              item.lineItemPrice
                ?.amount ??
              0
            ),

          autoSelected:
            item.autoSelected ===
            true
        })
      );

    const count =
      normalizedItems.reduce(
        (
          sum,
          item
        ) =>
          sum +
          item.quantity,
        0
      );

    const total =
      normalizedItems.reduce(
        (
          sum,
          item
        ) =>
          sum +
          (
            item.price *
            item.quantity
          ),
        0
      );

    return{
      items:
        normalizedItems,

      count,

      total
    };
  }

  function saveCart(
    cart
  ){

    const normalized =
      normalizeCart(
        cart
      );

    saveJson(
      "cajamoda-cart",
      normalized
    );

    syncBagCount();

    return normalized;
  }

  /* ============================================================
     AUTO BAG SELECTION
     ============================================================ */

  function syncSelectionToBag(){

    if(
      !state.product ||
      !state.selectedSize
    ){
      return null;
    }

    const cart =
      readCart();

    let line =
      cart.items.find(
        item =>
          String(
            item.productId
          ) ===
          String(
            state.product.id
          ) &&
          item.autoSelected ===
          true
      );

    const image =
      getMedia(
        state.product
      )[0] ||
      state.product.image ||
      "";

    if(
      line
    ){

      /*
        Customer changed size or color.
        Update the same bag item.
        Bag count stays correct.
      */

      line.size =
        state.selectedSize;

      line.color =
        state.selectedColor;

      line.name =
        state.product.name;

      line.image =
        image;

      line.price =
        Number(
          state.product.price ||
          0
        );

      line.quantity =
        1;

    }else{

      line = {

        id:
          `selection-${state.product.id}`,

        productId:
          state.product.id,

        variantId:
          null,

        name:
          state.product.name,

        image,

        size:
          state.selectedSize,

        color:
          state.selectedColor,

        quantity:
          1,

        price:
          Number(
            state.product.price ||
            0
          ),

        autoSelected:
          true
      };

      cart.items.push(
        line
      );
    }

    const saved =
      saveCart(
        cart
      );

    /*
      Bridge hook for Wix eCom.
      Local UI responds immediately.
    */

    sendBridge(
      "ADD_TO_CART",
      {

        productId:
          state.product.id,

        size:
          state.selectedSize,

        color:
          state.selectedColor,

        quantity:
          1,

        selectionMode:
          "SIZE_SELECTION"
      }
    );

    return saved;
  }

  /* ============================================================
     INCOMING BRIDGE
     ============================================================ */

  window.addEventListener(
    "message",
    event => {

      const message =
        event.data ||
        {};

      if(
        message.source &&
        !CONFIG.acceptedSources.includes(
          message.source
        )
      ){
        return;
      }

      const payload =
        message.payload ??
        message.data ??
        {};

      if(
        message.type ===
        "INIT"
      ){

        if(
          Array.isArray(
            payload.products
          )
        ){

          saveJson(
            "cajamoda-catalog",
            payload.products
          );

          state.catalog =
            payload.products;

          loadInitialProduct();
        }

        if(
          payload.cart
        ){

          /*
            Only replace the local cart if real line items
            were actually supplied.
          */

          const incoming =
            payload.cart;

          const incomingItems =
            incoming.items ||
            incoming.lineItems ||
            [];

          if(
            Array.isArray(
              incomingItems
            ) &&
            incomingItems.length
          ){

            saveCart(
              incoming
            );
          }
        }

        syncBagCount();
      }

      if(
        message.type ===
        "CATALOG_PATCH" &&
        Array.isArray(
          payload.products
        )
      ){

        const current =
          readJson(
            "cajamoda-catalog",
            []
          );

        const map =
          new Map(
            (
              Array.isArray(
                current
              )
                ?current
                :[]
            )
              .map(
                product => [
                  String(
                    product.id
                  ),
                  product
                ]
              )
          );

        payload.products
          .forEach(
            product => {

              map.set(
                String(
                  product.id
                ),
                product
              );

            }
          );

        const nextCatalog =
          [
            ...map.values()
          ];

        saveJson(
          "cajamoda-catalog",
          nextCatalog
        );

        state.catalog =
          nextCatalog;

        loadInitialProduct();
      }

      if(
        message.type ===
        "CART_STATE"
      ){

        const incoming =
          payload.cart ||
          payload;

        const incomingItems =
          incoming.items ||
          incoming.lineItems ||
          [];

        /*
          Do not let an empty placeholder bridge response
          erase the user's immediate local size selection.
        */

        if(
          Array.isArray(
            incomingItems
          ) &&
          incomingItems.length
        ){

          saveCart(
            incoming
          );
        }

        syncBagCount();
      }

    }
  );

  /* ============================================================
     CROSS PAGE STORAGE
     ============================================================ */

  window.addEventListener(
    "storage",
    event => {

      if(
        event.key ===
        "cajamoda-cart"
      ){

        syncBagCount();
      }

      if(
        event.key ===
        "cajamoda-favorites"
      ){

        const favorites =
          readJson(
            "cajamoda-favorites",
            []
          );

        state.favorites =
          new Set(
            Array.isArray(
              favorites
            )
              ?favorites
                .map(String)
              :[]
          );

        syncFavoriteUI();
      }

    }
  );

  window.addEventListener(
    "pageshow",
    () => {

      syncBagCount();

      const favorites =
        readJson(
          "cajamoda-favorites",
          []
        );

      state.favorites =
        new Set(
          Array.isArray(
            favorites
          )
            ?favorites
              .map(String)
            :[]
      );

      syncFavoriteUI();
    }
  );

  /* ============================================================
     INITIALIZE
     ============================================================ */

  loadInitialProduct();

  syncBagCount();

  sendBridge(
    "READY",
    {

      page:
        "PRODUCT",

      brand:
        "CAJAMODA",

      version:
        "CAJAMODA_PRODUCT_FREEZE_V2",

      capabilities:[

        "FULL_SCREEN_PRODUCT_PHOTO",

        "NO_TOP_LEFT_BUTTON",

        "NO_PRODUCT_LOGO",

        "FIVE_PRODUCT_PHOTOS",

        "FOUR_RIGHT_THUMBNAILS",

        "NO_THUMBNAIL_NUMBER_OVERLAP",

        "PRODUCT_NUMBER_1_TO_100",

        "SWIPE_PRODUCTS_WITHIN_CATEGORY",

        "RED_FAVORITE",

        "HAPTIC_FAVORITE",

        "SOCIAL_SHARE",

        "INSTAGRAM_SHARE",

        "TIKTOK_SHARE",

        "WHATSAPP_SHARE",

        "COLLAPSED_PRICE_CAPSULE",

        "CLEAR_GLASS_DETAILS",

        "GLASS_BACKDROP_BLUR",

        "DESCRIPTION_BEFORE_OPTIONS",

        "COLOR_SELECTION",

        "XS_S_M_L_XL",

        "SIZE_AUTO_ADDS_TO_BAG",

        "DYNAMIC_BAG_COUNT",

        "ADD_TO_BAG_CONFIRM",

        "BUY_NOW",

        "CHECKOUT_ROUTE",

        "REVIEWS_RESERVED_FOR_REAL_BACKEND"
      ]
    }
  );

  sendBridge(
    "GET_CART"
  );

})();

</script>
